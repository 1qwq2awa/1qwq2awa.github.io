                for (let i = 0; i < size; i++) {
                    for (let j = 0; j < size; j++) {
                        const h = heightMap[i * size + j];
                        const x = (i - half) * spacing;
                        const z = (j - half) * spacing;
                        const y = h * heightScale;
                        vertices[idx * 3] = x;
                        vertices[idx * 3 + 1] = y;
                        vertices[idx * 3 + 2] = z;
                        const ci = i * size + j;
                        colors[idx * 3] = colorMap[ci * 3];
                        colors[idx * 3 + 1] = colorMap[ci * 3 + 1];
                        colors[idx * 3 + 2] = colorMap[ci * 3 + 2];
                        uvs[idx * 2] = i / size;
                        uvs[idx * 2 + 1] = j / size;
                        idx++;
                    }
                }

                for (let i = 0; i < size - 1; i++) {
                    for (let j = 0; j < size - 1; j++) {
                        const a = i * size + j;
                        const b = (i + 1) * size + j;
                        const c = i * size + (j + 1);
                        const d = (i + 1) * size + (j + 1);
                        indices.push(a, b, c);
                        indices.push(b, d, c);
                    }
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();

                const material = new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    roughness: 0.6,
                    metalness: 0.05,
                    flatShading: false,
                    side: THREE.DoubleSide,
                    envMapIntensity: 0.2,
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                if (this.mesh) {
                    this.scene.remove(this.mesh);
                    this.mesh.geometry.dispose();
                    this.mesh.material.dispose();
                }
                this.mesh = mesh;
                this.scene.add(mesh);

                this.updateSea(seaLevel, size, spacing, heightScale);

                this.controls.target.set(0, 5, 0);
                this.controls.update();
                this.setData(data);

                this.generateTrees(data, treeDensity);

                if (this.walkMode) {
                    const pos = this.camera.position.clone();
                    const h = this.getTerrainHeight(pos.x, pos.z);
                    pos.y = h + this.playerHeight;
                    this.camera.position.copy(pos);
                }

                return mesh;
            }

            updateSea(seaLevel, size, spacing, heightScale) {
                if (this.seaMesh) {
                    this.scene.remove(this.seaMesh);
                    this.seaMesh.geometry.dispose();
                    this.seaMesh.material.dispose();
                    this.seaMesh = null;
                }

                const half = size / 2;
                const extent = half * spacing;
                const y = seaLevel * heightScale;

                const geo = new THREE.PlaneGeometry(extent * 2.1, extent * 2.1);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x1a5276,
                    transparent: true,
                    opacity: 0.55,
                    roughness: 0.3,
                    metalness: 0.1,
                    side: THREE.DoubleSide,
                    envMapIntensity: 0.3,
                });
                const sea = new THREE.Mesh(geo, mat);
                sea.rotation.x = -Math.PI / 2;
                sea.position.set(0, y, 0);
                sea.receiveShadow = true;
                this.scene.add(sea);
                this.seaMesh = sea;
            }

            addStars() {
                const starsGeo = new THREE.BufferGeometry();
                const count = 4000;
                const positions = new Float32Array(count * 3);
                for (let i = 0; i < count * 3; i++) {
                    positions[i] = (Math.random() - 0.5) * 800;
                }
                starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const starsMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.1,
                    transparent: true,
                    opacity: 0.6,
                });
                const stars = new THREE.Points(starsGeo, starsMat);
                this.scene.add(stars);
            }

            resize() {
                const w = this.container.clientWidth;
                const h = this.container.clientHeight;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const delta = 0.016;
                if (this.walkMode) {
                    this.updateWalk(delta);
                } else {
                    this.controls.update();
                }
                this.renderer.render(this.scene, this.camera);
            }

            dispose() {
                document.removeEventListener('keydown', this._onKeyDown);
                document.removeEventListener('keyup', this._onKeyUp);
                document.removeEventListener('mousemove', this._onMouseMove);
                document.removeEventListener('pointerlockchange', this._onPointerLockChange);
            }
        }

        // ================================================================
        //  主程序
        // ================================================================
        const container = document.getElementById('canvas-container');
        const loading = document.getElementById('loading');

        const renderer = new TerrainRenderer(container);
        renderer.addStars();

        const generator = new TerrainGenerator(300);

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function generateAndDisplay(params) {
            loading.classList.remove('hidden');
            const stepDisplay = document.getElementById('step-display');
            const stepIcon = stepDisplay.querySelector('.step-icon');
            const stepText = stepDisplay.querySelector('.step-text');
            const stepProgress = stepDisplay.querySelector('.step-progress');

            function updateStep(icon, text, progress) {
                stepIcon.textContent = icon;
                stepText.textContent = text;
                stepProgress.textContent = progress || '';
            }

            updateStep('⏳', '准备生成...', '');
            await sleep(20);

            try {
                generator.setParams(params);

                updateStep('🔊', '1/9: 生成基础噪声地形', '');
                await sleep(20);
                generator.generateHeightmap();

                updateStep('⛰️', '2/9: 模拟板块挤压', '');
                await sleep(20);
                generator.applyPlateTectonics();

                updateStep('🌋', '3/9: 火山爆发造山', '');
                await sleep(20);
                generator.addVolcanoes();

                updateStep('🌡️', '4/9: 计算温度分布', '');
                await sleep(20);
                generator.computeTemperature();

                updateStep('🌧️', '5/9: 计算降雨分布', '');
                await sleep(20);
                generator.computeRainfall();

                updateStep('🌊', '6/9: 生成超长河流', '');
                await sleep(20);
                generator.simulateRivers();

                updateStep('🕳️', '7/9: 生成洞穴系统', '');
                await sleep(20);
                generator.generateCaves();

                updateStep('🔄', '8/9: 更新温度与降雨', '');
                await sleep(20);
                generator.computeTemperature();
                generator.computeRainfall();

                updateStep('🎨', '9/9: 生成颜色与地形类型', '');
                await sleep(20);
                generator.generateColors();
                generator.computeTerrainTypes();

                const data = generator.getResult();
                const treeDensity = params.treeDensity || 0.8;
                renderer.buildTerrain(data, treeDensity);

                const stats = generator.getStats();
                document.getElementById('stat-vertices').textContent = `顶点: ${stats.vertices}`;
                document.getElementById('stat-faces').textContent = `面: ${stats.faces}`;
                document.getElementById('stat-volcanoes').textContent = `火山: ${stats.volcanoes}`;
                document.getElementById('stat-rivers').textContent = `河流: ${stats.rivers}`;
                document.getElementById('stat-caves').textContent = `洞穴: ${stats.caves}`;

                updateStep('✅', '生成完成！', '');
                loading.classList.add('hidden');

            } catch (err) {
                console.error(err);
                updateStep('❌', '生成出错，请重试', '');
                loading.classList.add('hidden');
            }
        }

        // ---- UI 绑定 ----
        function setupUI() {
            const sliders = {
                seed: { el: document.getElementById('seed'), display: document.getElementById('seed-val') },
                amplitude: { el: document.getElementById('amplitude'), display: document.getElementById('amp-val') },
                frequency: { el: document.getElementById('frequency'), display: document.getElementById('freq-val') },
                plateStrength: { el: document.getElementById('plate-strength'), display: document.getElementById(
                        'plate-val') },
                seaLevel: { el: document.getElementById('sea-level'), display: document.getElementById('sealevel-val') },
                volcanoes: { el: document.getElementById('volcanoes'), display: document.getElementById('volc-val') },
                volcanoStrength: { el: document.getElementById('volcano-strength'), display: document.getElementById(
                        'volc-str-val') },
                temperature: { el: document.getElementById('temperature'), display: document.getElementById('temp-val') },
                rainfall: { el: document.getElementById('rainfall'), display: document.getElementById('rain-val') },
                rivers: { el: document.getElementById('rivers'), display: document.getElementById('river-val') },
                meander: { el: document.getElementById('meander-strength'), display: document.getElementById(
                        'meander-val') },
                riverVolume: { el: document.getElementById('river-volume'), display: document.getElementById('volume-val') },
                caveCount: { el: document.getElementById('cave-count'), display: document.getElementById('cave-count-val') },
                caveSize: { el: document.getElementById('cave-size'), display: document.getElementById('cave-size-val') },
                treeDensity: { el: document.getElementById('tree-density'), display: document.getElementById(
                        'tree-density-val') },
            };

            const giantCheckbox = document.getElementById('giant-mode');
            const walkCheckbox = document.getElementById('walk-mode');

            walkCheckbox.addEventListener('change', () => {
                const enabled = walkCheckbox.checked;
                renderer.toggleWalkMode(enabled);
                if (enabled) {
                    renderer.renderer.domElement.focus();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                const isLocked = document.pointerLockElement === renderer.renderer.domElement;
                if (!isLocked && walkCheckbox.checked) {
                    walkCheckbox.checked = false;
                    renderer.toggleWalkMode(false);
                }
            });

            function getParams() {
                return {
                    seed: parseFloat(sliders.seed.el.value),
                    amplitude: parseFloat(sliders.amplitude.el.value),
                    frequency: parseFloat(sliders.frequency.el.value),
                    plateStrength: parseFloat(sliders.plateStrength.el.value),
                    seaLevel: parseFloat(sliders.seaLevel.el.value),
                    volcanoCount: parseInt(sliders.volcanoes.el.value),
                    volcanoStrength: parseFloat(sliders.volcanoStrength.el.value),
                    temperatureOffset: parseFloat(sliders.temperature.el.value),
                    rainfall: parseFloat(sliders.rainfall.el.value),
                    riverCount: parseInt(sliders.rivers.el.value),
                    meanderStrength: parseFloat(sliders.meander.el.value),
                    riverVolume: parseFloat(sliders.riverVolume.el.value),
                    giantMode: giantCheckbox.checked,
                    caveCount: parseInt(sliders.caveCount.el.value),
                    caveSize: parseFloat(sliders.caveSize.el.value),
                    treeDensity: parseFloat(sliders.treeDensity.el.value),
                };
            }

            function updateDisplays() {
                for (const key of Object.keys(sliders)) {
                    const { el, display } = sliders[key];
                    if (display) {
                        const val = parseFloat(el.value);
                        display.textContent = Number.isInteger(val) ? val : val.toFixed(2);
                    }
                }
            }

            for (const key of Object.keys(sliders)) {
                const { el } = sliders[key];
                el.addEventListener('input', updateDisplays);
            }

            document.getElementById('generate-btn').addEventListener('click', () => {
                const params = getParams();
                const stepDisplay = document.getElementById('step-display');
                stepDisplay.querySelector('.step-icon').textContent = '⏳';
                stepDisplay.querySelector('.step-text').textContent = '开始生成...';
                stepDisplay.querySelector('.step-progress').textContent = '';
                if (walkCheckbox.checked) {
                    walkCheckbox.checked = false;
                    renderer.toggleWalkMode(false);
                }
                generateAndDisplay(params);
            });

            updateDisplays();
            const initialParams = getParams();
            generateAndDisplay(initialParams);

            document.addEventListener('keydown', (e) => {
                if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) {
                    document.getElementById('generate-btn').click();
                }
            });
        }

        setupUI();
        renderer.animate();

        setTimeout(() => {
            loading.classList.add('hidden');
        }, 1500);

        console.log('🌍 3D 自然地图生成器 · 高密度森林，边界分明');
        console.log('💡 丘陵和高地区域树木茂密，平原稀疏，过渡清晰');
    </script>
</body>
</html>
