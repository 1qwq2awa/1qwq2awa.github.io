                playSound('click');
                setMessage('📱 继续玩手机...', '');
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                if (STATE.ringActive) muteRing();
                updateUI();
                updateMessage();
            }

            function actionHide() {
                if (STATE.gameOver || STATE.gameWon || STATE.paused || STATE.ringActive || STATE.lockActionGlobal) return;
                if (STATE.phone === 'hidden') { setMessage('🙈 手机已经藏好了', ''); return; }
                startQTE();
            }

            function actionLock(key) {
                if (STATE.gameOver || STATE.gameWon || STATE.qteActive || STATE.paused || STATE.ringActive) return;
                if (STATE.lockActionGlobal) return;
                const d = STATE.doors[key];
                if (d.locked && d.lockTimer > 0) return;
                if (d.lockActionActive) return;
                if (STATE.doorCooldown > 0) return;
                lockDoor(key);
                STATE.doorCooldown = 0.3;
            }

            function actionUnlock(key) {
                if (STATE.gameOver || STATE.gameWon || STATE.qteActive || STATE.paused || STATE.ringActive) return;
                if (STATE.lockActionGlobal) return;
                const d = STATE.doors[key];
                if (!d.locked || d.lockTimer <= 0) return;
                if (d.lockActionActive) return;
                if (STATE.doorCooldown > 0) return;
                d.locked = false;
                d.lockTimer = 0;
                d.progress = 0;
                if (key === 'left') doorLeftProgress.style.width = '0%';
                else doorRightProgress.style.width = '0%';
                STATE.doorCooldown = 0.3;
                playSound('unlock');
                setMessage(`🔓 ${key === 'left' ? '左' : '右'}门已打开`, '');
                updateDoorUI();
                updateUI();
                updateMessage();
                if (STATE.parents === 'atDoor' && STATE.targetDoor === key) {
                    STATE.parents = 'inside';
                    STATE.parentsTimer = 0;
                    handleParentsEnter();
                    updateUI();
                    updateMessage();
                }
            }

            // ---------- 结束 ----------
            function gameOver(title, sub, emoji) {
                if (STATE._gameOverTriggered) return;
                STATE._gameOverTriggered = true;
                STATE.gameOver = true;
                STATE.paused = true;
                if (STATE.loopInterval) cancelAnimationFrame(STATE.loopInterval);
                const minutes = Math.floor((STATE.time - 22 * 60));
                resultEmoji.textContent = emoji || '😭';
                resultTitle.textContent = title || '被抓到了！';
                resultSub.textContent = sub || '手机被没收了...';
                let detail = `坚持了 ${minutes} 分钟 · 警觉值 ${Math.round(STATE.alertness)}%`;
                if (STATE.mode === 'seven') detail += ` · 第${STATE.day}晚`;
                resultDetail.textContent = detail;
                gameOverlay.classList.add('active');
                playSound('gameover');
                ringOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');
                lockActionOverlay.classList.remove('active');
                updateUI();
            }

            function winGame(title, sub) {
                if (STATE._gameOverTriggered) return;
                STATE.gameWon = true;
                STATE.paused = true;
                if (STATE.loopInterval) cancelAnimationFrame(STATE.loopInterval);
                resultEmoji.textContent = '🎉';
                resultTitle.textContent = title || '胜利！';
                resultSub.textContent = sub || '你成功了！';
                let detail = `快乐值 ${Math.round(STATE.happiness)}% · 警觉值 ${Math.round(STATE.alertness)}%`;
                if (STATE.mode === 'seven') detail = `完成第${STATE.day}晚！` + detail;
                resultDetail.textContent = detail;
                gameOverlay.classList.add('active');
                playSound('win');
                ringOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');
                lockActionOverlay.classList.remove('active');
                updateUI();
            }

            // ---------- 键盘 ----------
            function handleKeydown(e) {
                const key = e.key;
                if (key === 'x' || key === 'X') {
                    if (STATE.ringActive) { e.preventDefault();
                        muteRing(); return; }
                }
                if (STATE.qteActive && !STATE.qteDone) {
                    const valid = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
                    if (valid.includes(key)) { e.preventDefault();
                        qteInput(key); return; }
                }
                if (STATE.gameOver || STATE.gameWon || STATE.paused || STATE.ringActive || STATE.lockActionGlobal) return;
                switch (key) {
                    case '1':
                        actionPlay();
                        break;
                    case '2':
                        actionHide();
                        break;
                    case '3':
                        actionLock('left');
                        break;
                    case '4':
                        actionUnlock('left');
                        break;
                    case '5':
                        if (STATE.day >= 6 || STATE.mode === 'free' && false) actionLock('right');
                        break;
                    case '6':
                        if (STATE.day >= 6 || STATE.mode === 'free' && false) actionUnlock('right');
                        break;
                }
            }

            // ---------- 音效 ----------
            let audioCtx = null;

            function getAudioCtx() {
                if (!audioCtx) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; }
                }
                return audioCtx;
            }

            function playSound(type) {
                try {
                    const ctx = getAudioCtx();
                    if (!ctx) return;
                    if (ctx.state === 'suspended') ctx.resume();
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    let freq = 440,
                        duration = 0.1,
                        vol = 0.05,
                        typeOsc = 'sine';
                    switch (type) {
                        case 'footstep':
                            freq = 120;
                            duration = 0.2;
                            vol = 0.08;
                            typeOsc = 'sine';
                            break;
                        case 'knock':
                            freq = 300;
                            duration = 0.08;
                            vol = 0.08;
                            typeOsc = 'square';
                            break;
                        case 'enter':
                            freq = 400;
                            duration = 0.25;
                            vol = 0.08;
                            typeOsc = 'sawtooth';
                            break;
                        case 'caught':
                            freq = 600;
                            duration = 0.4;
                            vol = 0.1;
                            typeOsc = 'square';
                            break;
                        case 'safe':
                            freq = 523;
                            duration = 0.3;
                            vol = 0.06;
                            typeOsc = 'sine';
                            break;
                        case 'lock':
                            freq = 600;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'square';
                            break;
                        case 'lock_start':
                            freq = 300;
                            duration = 0.2;
                            vol = 0.04;
                            typeOsc = 'sine';
                            break;
                        case 'unlock':
                            freq = 200;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'square';
                            break;
                        case 'ring':
                            freq = 880;
                            duration = 0.35;
                            vol = 0.06;
                            typeOsc = 'square';
                            break;
                        case 'mute':
                            freq = 600;
                            duration = 0.12;
                            vol = 0.04;
                            typeOsc = 'sine';
                            break;
                        case 'qte_start':
                            freq = 440;
                            duration = 0.2;
                            vol = 0.06;
                            typeOsc = 'sine';
                            break;
                        case 'qte_correct':
                            freq = 880;
                            duration = 0.06;
                            vol = 0.05;
                            typeOsc = 'sine';
                            break;
                        case 'qte_fail':
                            freq = 200;
                            duration = 0.25;
                            vol = 0.06;
                            typeOsc = 'sawtooth';
                            break;
                        case 'qte_success':
                            freq = 659;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'sine';
                            break;
                        case 'gameover':
                            freq = 400;
                            duration = 0.3;
                            vol = 0.08;
                            typeOsc = 'sawtooth';
                            break;
                        case 'win':
                            freq = 523;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'sine';
                            break;
                        default:
                            return;
                    }
                    osc.type = typeOsc;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (_) {}
            }

            // ---------- 事件绑定 ----------
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.mode;
                    startGame(mode);
                });
            });

            btnPlay.addEventListener('click', actionPlay);
            btnHide.addEventListener('click', actionHide);
            btnLockLeft.addEventListener('click', () => actionLock('left'));
            btnUnlockLeft.addEventListener('click', () => actionUnlock('left'));
            btnLockRight.addEventListener('click', () => actionLock('right'));
            btnUnlockRight.addEventListener('click', () => actionUnlock('right'));

            doorLeft.addEventListener('click', () => {
                if (STATE.doors.left.locked && STATE.doors.left.lockTimer > 0) actionUnlock('left');
                else actionLock('left');
            });
            doorRight.addEventListener('click', () => {
                if (STATE.doors.right.locked && STATE.doors.right.lockTimer > 0) actionUnlock('right');
                else actionLock('right');
            });

            phoneCell.addEventListener('click', () => {
                if (STATE.phone === 'playing') actionHide();
                else actionPlay();
            });

            restartBtn.addEventListener('click', () => {
                menuOverlay.classList.remove('hidden');
                gameOverlay.classList.remove('active');
                if (STATE.loopInterval) cancelAnimationFrame(STATE.loopInterval);
                document.getElementById('door-right').style.display = 'none';
                roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr';
                btnLockRight.style.display = 'none';
                btnUnlockRight.style.display = 'none';
            });

            document.addEventListener('keydown', handleKeydown);
            document.addEventListener('dblclick', e => e.preventDefault());
            document.addEventListener('touchmove', e => {
                if (e.target.closest('#game')) e.preventDefault();
            }, { passive: false });

            // ---------- 初始菜单 ----------
            menuOverlay.classList.remove('hidden');
            console.log('📱 保护手机 - 七天模式 + 快乐值');
            console.log('🎮 快捷键: 1玩 2藏 · 3锁左门 4开左门 · 5锁右门 6开右门 · X静音');
            console.log('⬆️⬇️⬅️➡️ QTE · 快乐值达标才能过关！');
        })();
    </script>
</body>
