<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 七天手机 - 快乐值挑战</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
            background-image: radial-gradient(ellipse at 30% 20%, #1a1f35 0%, #0b0e1a 70%);
        }

        #game {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(145deg, #141a2b, #1a2138);
            border-radius: 40px 40px 32px 32px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            transition: opacity 0.2s;
        }

        /* ===== 菜单 ===== */
        #menu-overlay {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        #menu-overlay.hidden {
            display: none;
        }

        .menu-logo {
            font-size: 72px;
            margin-bottom: 4px;
        }
        .menu-title {
            font-size: 30px;
            font-weight: 800;
            color: #f7e9a0;
            margin-bottom: 4px;
        }
        .menu-sub {
            font-size: 16px;
            color: #9aacd8;
            margin-bottom: 24px;
            max-width: 300px;
        }

        .menu-btn {
            padding: 14px 32px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            color: #b8c7e6;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            width: 220px;
            margin: 6px 0;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
        .menu-btn .desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.6;
            display: block;
        }
        .menu-btn.free {
            border-color: #8fcbff;
            color: #8fcbff;
        }
        .menu-btn.free:hover {
            background: rgba(100, 180, 255, 0.1);
        }
        .menu-btn.seven {
            border-color: #f7e9a0;
            color: #f7e9a0;
        }
        .menu-btn.seven:hover {
            background: rgba(247, 233, 160, 0.1);
        }

        /* ===== 状态栏 ===== */
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 10px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 4px 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #b8c7e6;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 10px 3px 8px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-item .emoji {
            font-size: 16px;
        }

        #time-display {
            color: #f7e9a0;
            font-size: 17px;
            font-weight: 700;
            min-width: 48px;
            text-align: center;
        }

        #day-display {
            color: #8fcbff;
            font-size: 15px;
            font-weight: 700;
            min-width: 50px;
            text-align: center;
        }

        #lives-display {
            color: #ff7b89;
            font-size: 16px;
        }

        /* ===== 快乐值和警觉值进度条 ===== */
        .meter-wrap {
            width: 100%;
            margin: 6px 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
        }

        .meter-wrap .label {
            font-size: 13px;
            font-weight: 600;
            color: #9aacd8;
            white-space: nowrap;
            min-width: 32px;
        }

        .meter-track {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .meter-bar.happy {
            background: linear-gradient(90deg, #7bff9e, #f7e9a0);
        }

        .meter-bar.alert {
            background: linear-gradient(90deg, #f7e9a0, #ff7b89);
        }

        .meter-text {
            font-size: 13px;
            font-weight: 600;
            color: #9aacd8;
            min-width: 36px;
            text-align: right;
        }

        /* ===== 场景 ===== */
        #scene {
            position: relative;
            padding: 18px 12px 14px;
            margin: 12px 0 10px;
            background: radial-gradient(ellipse at 50% 80%, #1e2742, #11172b);
            border-radius: 28px;
            min-height: 160px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 8px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        #scene.danger {
            border-color: rgba(255, 80, 80, 0.3);
            box-shadow: inset 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 50, 50, 0.08);
        }

        .room-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px 8px;
            width: 100%;
            max-width: 360px;
            justify-items: center;
            align-items: center;
        }

        .room-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            padding: 4px 2px;
            border-radius: 14px;
            transition: all 0.25s;
            position: relative;
            min-width: 44px;
            min-height: 48px;
        }

        .room-item .sub {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
            margin-top: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 6px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .room-item .sub.active {
            color: #f7e9a0;
            background: rgba(247, 233, 160, 0.12);
        }
        .room-item .sub.danger {
            color: #ff7b89;
            background: rgba(255, 80, 80, 0.15);
            animation: pulse-text 0.6s ease-in-out infinite alternate;
        }
        .room-item .sub.success {
            color: #7bff9e;
            background: rgba(123, 255, 158, 0.12);
        }

        #bed-cell {
            grid-column: 1;
            grid-row: 1 / 3;
            font-size: 36px;
        }

        #phone-cell {
            grid-column: 2;
            grid-row: 1;
            font-size: 38px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        #phone-cell:active {
            transform: scale(0.92);
        }
        #phone-cell.playing {
            animation: glow-phone 1.2s ease-in-out infinite alternate;
        }
        #phone-cell.hidden {
            opacity: 0.3;
            filter: grayscale(0.8);
        }
        #phone-cell.ringing {
            animation: ring-phone 0.3s ease-in-out infinite alternate;
        }

        #player-cell {
            grid-column: 2;
            grid-row: 2;
            font-size: 36px;
        }
        #player-cell.hidden-away {
            opacity: 0.25;
            filter: grayscale(0.6);
        }

        #door-left {
            grid-column: 3;
            grid-row: 1 / 3;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #door-left:active {
            transform: scale(0.92);
        }
        #door-left.shaking {
            animation: shake-door 0.3s ease-in-out infinite alternate;
        }

        #door-right {
            grid-column: 4;
            grid-row: 1 / 3;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }
        #door-right:active {
            transform: scale(0.92);
        }
        #door-right.shaking {
            animation: shake-door 0.3s ease-in-out infinite alternate;
        }

        .door-lock-progress {
            width: 32px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 2px;
            overflow: hidden;
        }
        .door-lock-progress .bar {
            height: 100%;
            width: 0%;
            background: #f7e9a0;
            border-radius: 4px;
            transition: width 0.1s;
        }

        #parents-cell {
            grid-column: 3 / 5;
            grid-row: 3;
            font-size: 32px;
            transition: all 0.5s;
            min-height: 44px;
        }

        #window-cell {
            grid-column: 1;
            grid-row: 3;
            font-size: 26px;
            opacity: 0.4;
        }

        /* ===== 消息 ===== */
        #message-area {
            margin-top: 8px;
            padding: 6px 14px;
            min-height: 38px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 40px;
            text-align: center;
            font-size: 14px;
            color: #9aacd8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.03);
            width: 100%;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: all 0.25s;
        }
        #message-area .danger-text {
            color: #ff7b89;
            font-weight: 600;
            animation: pulse-text 0.5s ease-in-out infinite alternate;
        }
        #message-area .success-text {
            color: #7bff9e;
            font-weight: 600;
        }
        #message-area .highlight {
            color: #f7e9a0;
            font-weight: 600;
        }

        /* ===== 按钮 ===== */
        #actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
            margin: 10px 0 8px;
        }

        .action-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            color: #b8c7e6;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            font-family: inherit;
            line-height: 1.2;
            min-height: 48px;
            justify-content: center;
        }
        .action-btn .emoji {
            font-size: 20px;
        }
        .action-btn .label {
            font-size: 10px;
            opacity: 0.7;
            font-weight: 400;
        }
        .action-btn:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.1);
        }
        .action-btn:disabled {
            opacity: 0.3;
            transform: none;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .action-btn.primary {
            background: rgba(100, 180, 255, 0.12);
            border-color: rgba(100, 180, 255, 0.15);
            color: #8fcbff;
        }
        .action-btn.danger {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 80, 80, 0.15);
            color: #ff7b89;
        }
        .action-btn.warning {
            background: rgba(255, 200, 100, 0.08);
            border-color: rgba(255, 200, 100, 0.12);
            color: #f7e9a0;
        }

        /* ===== 覆盖层 ===== */
        #qte-overlay,
        #ring-overlay,
        #lock-action-overlay,
        #game-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 28px;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #qte-overlay.active,
        #ring-overlay.active,
        #lock-action-overlay.active,
        #game-overlay.active {
            display: flex;
        }

        #qte-overlay {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
        #qte-title {
            color: #f7e9a0;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        #qte-subtitle {
            color: #9aacd8;
            font-size: 13px;
            margin-bottom: 12px;
        }
        #qte-sequence {
            display: flex;
            gap: 14px;
            margin: 6px 0 12px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .qte-arrow {
            font-size: 38px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: all 0.15s;
            color: #6a7ca0;
        }
        .qte-arrow.active {
            border-color: #f7e9a0;
            color: #f7e9a0;
            background: rgba(247, 233, 160, 0.1);
            box-shadow: 0 0 20px rgba(247, 233, 160, 0.08);
            transform: scale(1.05);
        }
        .qte-arrow.done {
            border-color: #7bff9e;
            color: #7bff9e;
            background: rgba(123, 255, 158, 0.08);
        }
        .qte-arrow.wrong {
            border-color: #ff7b89;
            color: #ff7b89;
            background: rgba(255, 80, 80, 0.15);
            animation: shake-wrong 0.3s;
        }
        #qte-timer {
            width: 180px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin: 4px 0 10px;
        }
        #qte-timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff7b89, #f7e9a0);
            border-radius: 10px;
            transition: width 0.05s linear;
        }
        #qte-result {
            font-size: 14px;
            font-weight: 600;
            min-height: 24px;
            color: #9aacd8;
        }

        #ring-overlay {
            background: rgba(200, 50, 50, 0.2);
            backdrop-filter: blur(4px);
            animation: ring-pulse 0.5s ease-in-out infinite alternate;
        }
        #ring-overlay .ring-icon {
            font-size: 56px;
            margin-bottom: 6px;
            animation: ring-phone 0.3s ease-in-out infinite alternate;
        }
        #ring-overlay .ring-text {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        #ring-overlay .ring-sub {
            color: #ffb07c;
            font-size: 15px;
            margin-top: 4px;
            font-weight: 600;
        }
        #ring-timer {
            width: 140px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        #ring-timer-bar {
            height: 100%;
            width: 100%;
            background: #ff7b89;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        #lock-action-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }
        #lock-action-overlay .lock-icon {
            font-size: 44px;
            margin-bottom: 6px;
        }
        #lock-action-overlay .lock-text {
            color: #f7e9a0;
            font-size: 18px;
            font-weight: 700;
        }
        #lock-action-overlay .lock-sub {
            color: #9aacd8;
            font-size: 14px;
            margin-top: 4px;
        }
        #lock-action-progress {
            width: 180px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        #lock-action-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f7e9a0, #ffb07c);
            border-radius: 10px;
            transition: width 0.1s;
        }

        #game-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            z-index: 30;
            padding: 30px 24px;
            text-align: center;
        }
        #game-overlay .big-emoji {
            font-size: 64px;
            margin-bottom: 8px;
        }
        #game-overlay .title {
            font-size: 26px;
            font-weight: 800;
            color: #f7e9a0;
            margin-bottom: 4px;
        }
        #game-overlay .subtitle {
            font-size: 16px;
            color: #9aacd8;
            margin-bottom: 4px;
            max-width: 280px;
        }
        #game-overlay .detail {
            font-size: 14px;
            color: #6a7ca0;
            margin-bottom: 16px;
        }
        #game-overlay .restart-btn {
            padding: 12px 40px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #f7e9a0, #e8c87a);
            color: #1a2138;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(247, 233, 160, 0.2);
        }
        #game-overlay .restart-btn:active {
            transform: scale(0.95);
        }

        /* ===== 动画 ===== */
        @keyframes glow-phone {
            0% {
                filter: drop-shadow(0 0 8px rgba(100, 180, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 24px rgba(100, 180, 255, 0.6));
                transform: scale(1.04);
            }
        }
        @keyframes ring-phone {
            0% {
                transform: rotate(-8deg) scale(1);
                filter: drop-shadow(0 0 10px rgba(255, 80, 80, 0.8));
            }
            100% {
                transform: rotate(8deg) scale(1.08);
                filter: drop-shadow(0 0 30px rgba(255, 80, 80, 1));
            }
        }
        @keyframes ring-pulse {
            0% {
                background: rgba(200, 50, 50, 0.15);
            }
            100% {
                background: rgba(200, 50, 50, 0.35);
            }
        }
        @keyframes shake-door {
            0% {
                transform: rotate(0deg) translateX(0);
            }
            100% {
                transform: rotate(4deg) translateX(4px);
            }
        }
        @keyframes pulse-text {
            0% {
                opacity: 0.6;
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }
        @keyframes shake-wrong {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            #game {
                padding: 14px 14px 18px;
                border-radius: 28px;
            }
            #menu-overlay {
                border-radius: 28px;
            }
            .status-item {
                font-size: 12px;
                padding: 2px 8px 2px 6px;
            }
            .status-item .emoji {
                font-size: 14px;
            }
            #time-display {
                font-size: 15px;
                min-width: 40px;
            }
            #day-display {
                font-size: 13px;
                min-width: 40px;
            }
            .meter-wrap .label {
                font-size: 11px;
                min-width: 26px;
            }
            .meter-text {
                font-size: 11px;
                min-width: 30px;
            }
            .room-item {
                font-size: 26px;
                min-height: 40px;
                min-width: 38px;
            }
            #bed-cell {
                font-size: 32px;
            }
            #phone-cell {
                font-size: 32px;
            }
            #player-cell {
                font-size: 32px;
            }
            #door-left,
            #door-right {
                font-size: 26px;
            }
            #parents-cell {
                font-size: 28px;
            }
            #scene {
                padding: 10px 6px 8px;
                min-height: 130px;
            }
            .action-btn {
                font-size: 12px;
                padding: 8px 2px;
                min-height: 42px;
                border-radius: 12px;
            }
            .action-btn .emoji {
                font-size: 17px;
            }
            .action-btn .label {
                font-size: 9px;
            }
            #message-area {
                font-size: 12px;
                padding: 5px 10px;
                min-height: 32px;
            }
            #qte-sequence {
                gap: 8px;
                padding: 6px 10px;
            }
            .qte-arrow {
                font-size: 30px;
                width: 42px;
                height: 42px;
            }
            #game-overlay .big-emoji {
                font-size: 48px;
            }
            #game-overlay .title {
                font-size: 22px;
            }
            .room-grid {
                gap: 4px 4px;
                max-width: 300px;
            }
            #ring-overlay .ring-icon {
                font-size: 42px;
            }
            #ring-overlay .ring-text {
                font-size: 17px;
            }
            #ring-overlay .ring-sub {
                font-size: 13px;
            }
            #lock-action-overlay .lock-icon {
                font-size: 36px;
            }
            #lock-action-overlay .lock-text {
                font-size: 16px;
            }
            .menu-btn {
                width: 180px;
                font-size: 16px;
                padding: 12px 20px;
            }
            .menu-logo {
                font-size: 56px;
            }
            .menu-title {
                font-size: 24px;
            }
        }

        @media (max-width: 360px) {
            .room-item {
                font-size: 22px;
                min-height: 34px;
                min-width: 32px;
            }
            #phone-cell {
                font-size: 28px;
            }
            #door-left,
            #door-right {
                font-size: 22px;
            }
            #bed-cell {
                font-size: 28px;
            }
            #player-cell {
                font-size: 28px;
            }
            #parents-cell {
                font-size: 24px;
            }
            .room-grid {
                max-width: 260px;
                gap: 2px 2px;
            }
            .action-btn {
                font-size: 11px;
                padding: 6px 2px;
                min-height: 36px;
            }
            .action-btn .emoji {
                font-size: 15px;
            }
            #qte-sequence {
                gap: 4px;
                padding: 4px 6px;
            }
            .qte-arrow {
                font-size: 24px;
                width: 34px;
                height: 34px;
            }
            #status-bar {
                padding-bottom: 6px;
            }
            .status-item {
                font-size: 10px;
                padding: 1px 6px 1px 4px;
            }
            #time-display {
                font-size: 13px;
                min-width: 34px;
            }
            #day-display {
                font-size: 11px;
                min-width: 34px;
            }
            .meter-wrap .label {
                font-size: 10px;
                min-width: 22px;
            }
            .meter-text {
                font-size: 10px;
                min-width: 26px;
            }
            #lock-action-progress {
                width: 120px;
            }
        }

        /* ===== 工具 ===== */
        .hidden {
            display: none !important;
        }
        kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #f7e9a0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .hard-mode #door-right {
            display: flex;
        }
        .hard-mode .room-grid {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .hard-mode #parents-cell {
            grid-column: 3 / 5;
        }
        /* 非困难模式只显示左门，右门隐藏 */
        .room-grid {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .hard-mode .room-grid {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        #door-right {
            display: none;
        }
        .hard-mode #door-right {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="game">

        <!-- ===== 菜单 ===== -->
        <div id="menu-overlay">
            <div class="menu-logo">📱</div>
            <div class="menu-title">保护手机</div>
            <div class="menu-sub">选择模式开始挑战</div>
            <button class="menu-btn free" data-mode="free">
                <span>🎮 自由模式</span>
                <span class="desc">一局定胜负 · 无快乐值要求</span>
            </button>
            <button class="menu-btn seven" data-mode="seven">
                <span>🌟 七天手机</span>
                <span class="desc">连续7晚 · 快乐值达标过关</span>
            </button>
        </div>

        <!-- ===== 状态栏 ===== -->
        <div id="status-bar">
            <div class="status-item">
                <span class="emoji">🌙</span>
                <span id="time-display">22:00</span>
            </div>
            <div class="status-item">
                <span class="emoji">📅</span>
                <span id="day-display">第1晚</span>
            </div>
            <div class="status-item">
                <span class="emoji">❤️</span>
                <span id="lives-display">❤️❤️❤️</span>
            </div>
        </div>

        <!-- ===== 快乐值 & 警觉值 ===== -->
        <div class="meter-wrap">
            <span class="label">😊</span>
            <div class="meter-track">
                <div class="meter-bar happy" id="happy-bar" style="width:0%"></div>
            </div>
            <span class="meter-text" id="happy-text">0%</span>
        </div>
        <div class="meter-wrap">
            <span class="label">⚠️</span>
            <div class="meter-track">
                <div class="meter-bar alert" id="alert-bar" style="width:0%"></div>
            </div>
            <span class="meter-text" id="alert-text">0%</span>
        </div>

        <!-- ===== 场景 ===== -->
        <div id="scene">
            <div class="room-grid" id="room-grid">
                <div id="bed-cell" class="room-item">🛏️<span class="sub">床</span></div>
                <div id="phone-cell" class="room-item playing" title="点击切换玩/藏">
                    📱<span class="sub active" id="phone-status">📱 玩手机</span>
                </div>
                <div id="player-cell" class="room-item">
                    🧑<span class="sub" id="player-status">😴 睡觉</span>
                </div>
                <div id="door-left" class="room-item" title="点击锁门/开门 (左门)">
                    🚪<span class="sub" id="door-left-label">🔓 未锁</span>
                    <div class="door-lock-progress"><div class="bar" id="door-left-progress"></div></div>
                </div>
                <div id="door-right" class="room-item" title="点击锁门/开门 (右门)">
                    🚪<span class="sub" id="door-right-label">🔓 未锁</span>
                    <div class="door-lock-progress"><div class="bar" id="door-right-progress"></div></div>
                </div>
                <div id="parents-cell" class="room-item">
                    <span id="parents-emoji">🌫️</span>
                    <span class="sub" id="parents-status">远离</span>
                </div>
                <div id="window-cell" class="room-item">🌙<span class="sub">窗外</span></div>
            </div>

            <div id="message-area">
                <span>🕹️ 玩手机到 <span class="highlight">24:00</span> 胜利！</span>
            </div>

            <!-- 覆盖层 -->
            <div id="ring-overlay">
                <div class="ring-icon">📢</div>
                <div class="ring-text">手机响了！</div>
                <div class="ring-sub">按 <kbd>X</kbd> 静音</div>
                <div id="ring-timer"><div id="ring-timer-bar" style="width:100%"></div></div>
            </div>
            <div id="qte-overlay">
                <div id="qte-title">🙈 藏手机！</div>
                <div id="qte-subtitle">按顺序点击方向键</div>
                <div id="qte-sequence"></div>
                <div id="qte-timer"><div id="qte-timer-bar" style="width:100%"></div></div>
                <div id="qte-result"></div>
            </div>
            <div id="lock-action-overlay">
                <div class="lock-icon">🔒</div>
                <div class="lock-text">正在锁门...</div>
                <div class="lock-sub">请等待 <span id="lock-action-remain">5</span> 秒</div>
                <div id="lock-action-progress"><div class="bar" id="lock-action-bar"></div></div>
            </div>
            <div id="game-overlay">
                <div class="big-emoji" id="result-emoji">😭</div>
                <div class="title" id="result-title">被抓到了！</div>
                <div class="subtitle" id="result-sub">手机被没收了...</div>
                <div class="detail" id="result-detail">坚持了 0 分钟</div>
                <button class="restart-btn" id="restart-btn">🔄 再来一次</button>
            </div>
        </div>

        <!-- ===== 操作按钮 ===== -->
        <div id="actions">
            <button class="action-btn primary" id="btn-play"><span class="emoji">📱</span><span class="label">玩手机</span></button>
            <button class="action-btn danger" id="btn-hide"><span class="emoji">🙈</span><span class="label">藏手机</span></button>
            <button class="action-btn warning" id="btn-lock-left"><span class="emoji">🔒</span><span class="label">锁左门</span></button>
            <button class="action-btn" id="btn-unlock-left"><span class="emoji">🔓</span><span class="label">开左门</span></button>
            <button class="action-btn warning" id="btn-lock-right" style="display:none;"><span class="emoji">🔒</span><span class="label">锁右门</span></button>
            <button class="action-btn" id="btn-unlock-right" style="display:none;"><span class="emoji">🔓</span><span class="label">开右门</span></button>
        </div>

        <div style="text-align:center;font-size:10px;color:rgba(255,255,255,0.12);padding-top:8px;letter-spacing:0.5px;">
            ⌨️ 1玩 2藏 · 3锁左门 4开左门 · 5锁右门 6开右门 · ↑↓←→ QTE · <kbd>X</kbd> 静音
        </div>
    </div>

    <script>
        // ============================================================
        //  游戏主逻辑 - 快乐值 + 七天手机模式
        // ============================================================
        (function() {
            'use strict';

            // ---------- DOM ----------
            const $ = id => document.getElementById(id);
            const timeDisplay = $('time-display');
            const dayDisplay = $('day-display');
            const livesDisplay = $('lives-display');
            const scene = $('scene');
            const phoneCell = $('phone-cell');
            const phoneStatus = $('phone-status');
            const playerCell = $('player-cell');
            const playerStatus = $('player-status');
            const parentsEmoji = $('parents-emoji');
            const parentsStatus = $('parents-status');
            const messageArea = $('message-area');
            const qteOverlay = $('qte-overlay');
            const qteSequence = $('qte-sequence');
            const qteTimerBar = $('qte-timer-bar');
            const qteResult = $('qte-result');
            const qteTitle = $('qte-title');
            const qteSubtitle = $('qte-subtitle');
            const gameOverlay = $('game-overlay');
            const resultEmoji = $('result-emoji');
            const resultTitle = $('result-title');
            const resultSub = $('result-sub');
            const resultDetail = $('result-detail');
            const restartBtn = $('restart-btn');
            const ringOverlay = $('ring-overlay');
            const ringTimerBar = $('ring-timer-bar');
            const happyBar = $('happy-bar');
            const happyText = $('happy-text');
            const alertBar = $('alert-bar');
            const alertText = $('alert-text');
            const menuOverlay = $('menu-overlay');
            const roomGrid = $('room-grid');
            const doorLeft = $('door-left');
            const doorRight = $('door-right');
            const doorLeftLabel = $('door-left-label');
            const doorRightLabel = $('door-right-label');
            const doorLeftProgress = $('door-left-progress');
            const doorRightProgress = $('door-right-progress');
            const lockActionOverlay = $('lock-action-overlay');
            const lockActionBar = $('lock-action-bar');
            const lockActionRemain = $('lock-action-remain');

            const btnPlay = $('btn-play');
            const btnHide = $('btn-hide');
            const btnLockLeft = $('btn-lock-left');
            const btnUnlockLeft = $('btn-unlock-left');
            const btnLockRight = $('btn-lock-right');
            const btnUnlockRight = $('btn-unlock-right');

            // ---------- 状态 ----------
            const STATE = {
                mode: 'free', // 'free' | 'seven'
                day: 1, // 当前第几天 (1-7)
                maxDay: 7,
                time: 22 * 60,
                targetTime: 24 * 60,
                phone: 'playing',
                lives: 3,
                maxLives: 3,
                alertness: 0,
                alertnessDecayTimer: 0,
                happiness: 0,
                happyTarget: 0, // 每日目标快乐值
                gameOver: false,
                gameWon: false,
                _gameOverTriggered: false,

                // 门
                doors: {
                    left: { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false, progress: 0 },
                    right: { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false, progress: 0 }
                },
                LOCK_ACTION_DURATION: 5,
                LOCK_DURATION: 30,

                // 父母
                parents: 'away',
                parentsTimer: 0,
                parentsCooldown: 0,
                parentsType: 'parent',
                targetDoor: 'left',
                doorTimer: 0,
                DOOR_OPEN_TIME: 5,
                parentsStayTimer: 0,
                PARENTS_STAY_TIME: 2.5,
                doorAlertTimer: 0,
                DOOR_ALERT_INTERVAL: 2.0,
                DOOR_ALERT_AMOUNT: 5,

                // QTE
                qteActive: false,
                qteSequence: [],
                qteIndex: 0,
                qteTimeLeft: 0,
                qteMaxTime: 3.0,
                qteSuccess: false,
                qteDone: false,

                // 响铃
                ringActive: false,
                ringTimer: 0,
                ringCooldown: 0,
                ringDuration: 3.0,
                ringMinInterval: 8,
                ringMaxInterval: 15,
                ringMuted: false,

                // 循环
                loopInterval: null,
                deltaTime: 0,
                lastTimestamp: 0,
                timeSpeed: 2.0,
                doorCooldown: 0,
                paused: false,
                lockActionGlobal: false,

                // 快乐值增加速率 (每秒增加量)
                happyRate: 1.2, // 每秒增加1.2点 (约100点/83秒)
            };

            // ---------- 辅助 ----------
            function formatTime(m) {
                const h = Math.floor(m / 60);
                const min = Math.floor(m % 60);
                return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
            }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function randomRange(min, max) { return Math.random() * (max - min) + min; }

            function randomInt(min, max) { return Math.floor(randomRange(min, max + 1)); }

            function generateQTESequence(len = 4) {
                const dirs = ['↑', '↓', '←', '→'];
                const map = { '↑': 'ArrowUp', '↓': 'ArrowDown', '←': 'ArrowLeft', '→': 'ArrowRight' };
                const seq = [];
                for (let i = 0; i < len; i++) {
                    const d = dirs[randomInt(0, 3)];
                    seq.push({ emoji: d, key: map[d] });
                }
                return seq;
            }

            // ---------- 快乐值 ----------
            function updateHappyUI() {
                const val = STATE.happiness;
                happyBar.style.width = Math.min(val, 100) + '%';
                happyText.textContent = Math.round(Math.min(val, 100)) + '%';
            }

            function addHappiness(amount) {
                if (STATE.gameOver || STATE.gameWon) return;
                STATE.happiness = clamp(STATE.happiness + amount, 0, 100);
                updateHappyUI();
            }

            // 每天重置快乐值（七天模式）或者自由模式不重置？
            function resetHappiness() {
                STATE.happiness = 0;
                updateHappyUI();
            }

            // 设定每日目标
            function setHappyTarget(day) {
                if (STATE.mode === 'free') {
                    STATE.happyTarget = 0; // 无要求
                    return;
                }
                // 七天模式：1-2天简单 60，3-5普通 70，6-7困难 80
                if (day <= 2) STATE.happyTarget = 60;
                else if (day <= 5) STATE.happyTarget = 70;
                else STATE.happyTarget = 80;
            }

            // 检查快乐值是否达标
            function checkHappyTarget() {
                if (STATE.mode === 'free') return true;
                return STATE.happiness >= STATE.happyTarget;
            }

            // ---------- 警觉值 ----------
            function updateAlertUI() {
                const val = STATE.alertness;
                alertBar.style.width = val + '%';
                alertText.textContent = Math.round(val) + '%';
                if (val < 30) alertBar.style.background = 'linear-gradient(90deg, #7bff9e, #a0f7a0)';
                else if (val < 60) alertBar.style.background = 'linear-gradient(90deg, #f7e9a0, #f7d07a)';
                else alertBar.style.background = 'linear-gradient(90deg, #ffb07c, #ff7b89)';
            }

            function addAlertness(amount, reason = '') {
                if (STATE.gameOver || STATE.gameWon) return;
                STATE.alertness = clamp(STATE.alertness + amount, 0, 100);
                updateAlertUI();
                if (STATE.alertness >= 100) {
                    STATE.alertness = 100;
                    gameOver('⚠️ 父母起疑了！', '警觉值达到100%... 手机被没收！', '😰');
                }
                if (reason && !STATE.gameOver) {
                    setMessage(`⚠️ 警觉 +${amount}% (${reason})`, 'danger-text');
                }
            }

            function decayAlertness(dt) {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return;
                STATE.alertnessDecayTimer += dt;
                if (STATE.alertnessDecayTimer >= 10.0) {
                    STATE.alertnessDecayTimer = 0;
                    if (STATE.alertness > 0) {
                        STATE.alertness = clamp(STATE.alertness - 3, 0, 100);
                        updateAlertUI();
                    }
                }
            }

            // ---------- 门管理 ----------
            function getDoor(key) { return STATE.doors[key] || STATE.doors.left; }

            function isDoorLocked(key) { const d = getDoor(key); return d.locked && d.lockTimer > 0; }

            function lockDoor(key) {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return false;
                const d = getDoor(key);
                if (d.lockActionActive) return false;
                if (isDoorLocked(key)) return false;
                d.lockActionActive = true;
                d.lockActionTimer = STATE.LOCK_ACTION_DURATION;
                d.progress = 0;
                showLockAction(key);
                playSound('lock_start');
                return true;
            }

            function updateLockAction(dt) {
                for (const key of ['left', 'right']) {
                    const d = STATE.doors[key];
                    if (d.lockActionActive) {
                        d.lockActionTimer -= dt;
                        d.progress = 1 - (d.lockActionTimer / STATE.LOCK_ACTION_DURATION);
                        if (key === 'left') doorLeftProgress.style.width = (d.progress * 100) + '%';
                        else doorRightProgress.style.width = (d.progress * 100) + '%';
                        if (STATE.lockActionGlobal && lockActionOverlay.classList.contains('active')) {
                            lockActionBar.style.width = (d.progress * 100) + '%';
                            lockActionRemain.textContent = Math.ceil(d.lockActionTimer);
                        }
                        if (d.lockActionTimer <= 0) {
                            d.lockActionActive = false;
                            d.locked = true;
                            d.lockTimer = STATE.LOCK_DURATION;
                            d.progress = 1;
                            if (key === 'left') doorLeftProgress.style.width = '100%';
                            else doorRightProgress.style.width = '100%';
                            hideLockAction();
                            playSound('lock');
                            setMessage(`🔒 ${key === 'left' ? '左' : '右'}门已锁 (30秒)`, '');
                            updateDoorUI();
                            updateUI();
                        }
                    }
                }
            }

            function showLockAction(key) {
                STATE.lockActionGlobal = true;
                lockActionOverlay.classList.add('active');
                lockActionBar.style.width = '0%';
                lockActionRemain.textContent = STATE.LOCK_ACTION_DURATION;
                STATE.paused = true;
                updateUI();
            }

            function hideLockAction() {
                STATE.lockActionGlobal = false;
                lockActionOverlay.classList.remove('active');
                STATE.paused = false;
                updateUI();
            }

            function updateDoorTimers(dt) {
                for (const key of ['left', 'right']) {
                    const d = STATE.doors[key];
                    if (d.locked && d.lockTimer > 0) {
                        d.lockTimer -= dt;
                        if (d.lockTimer <= 0) {
                            d.locked = false;
                            d.lockTimer = 0;
                            if (key === 'left') doorLeftProgress.style.width = '0%';
                            else doorRightProgress.style.width = '0%';
                            setMessage(`🔓 ${key === 'left' ? '左' : '右'}门自动解锁`, '');
                            playSound('unlock');
                            updateDoorUI();
                            updateUI();
                        }
                    }
                }
            }

            function updateDoorUI() {
                const l = STATE.doors.left,
                    r = STATE.doors.right;
                doorLeftLabel.textContent = l.locked ? '🔒 已锁' : '🔓 未锁';
                doorRightLabel.textContent = r.locked ? '🔒 已锁' : '🔓 未锁';
                if (!l.lockActionActive) doorLeftProgress.style.width = (l.locked && l.lockTimer > 0) ? '100%' : '0%';
                if (!r.lockActionActive) doorRightProgress.style.width = (r.locked && r.lockTimer > 0) ? '100%' : '0%';
                doorLeft.classList.toggle('shaking', STATE.parents === 'atDoor' && STATE.targetDoor === 'left');
                doorRight.classList.toggle('shaking', STATE.parents === 'atDoor' && STATE.targetDoor === 'right');
            }

            // ---------- 父母AI ----------
            function updateParents(dt) {
                if (STATE.gameOver || STATE.gameWon) return;
                const p = STATE.parents;
                if (p === 'away') {
                    STATE.parentsTimer += dt;
                    if (STATE.parentsTimer >= STATE.parentsCooldown) {
                        // 选择目标门和类型
                        if (STATE.mode === 'free' || STATE.day <= 2) {
                            // 简单：只有妈妈（左门）
                            STATE.parentsType = 'parent';
                            STATE.targetDoor = 'left';
                            STATE.DOOR_OPEN_TIME = 5;
                        } else if (STATE.day <= 5) {
                            // 普通：父母（左门），但可能随机右门？保持左门
                            STATE.parentsType = 'parent';
                            STATE.targetDoor = 'left';
                            STATE.DOOR_OPEN_TIME = 5;
                        } else {
                            // 困难：双门，随机
                            STATE.parentsType = Math.random() < 0.5 ? 'parent' : 'grandparent';
                            STATE.targetDoor = Math.random() < 0.5 ? 'left' : 'right';
                            STATE.DOOR_OPEN_TIME = 5;
                        }
                        STATE.parents = 'approaching';
                        STATE.parentsTimer = 0;
                        STATE.parentsCooldown = 0;
                        playSound('footstep');
                        const who = STATE.parentsType === 'parent' ? '👨👩 爸爸妈妈' : '👴👵 爷爷奶奶';
                        const doorSide = STATE.targetDoor === 'left' ? '左门' : '右门';
                        setMessage(`👣 ${who} 来了（${doorSide}）！`, 'danger-text');
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'approaching') {
                    STATE.parentsTimer += dt;
                    if (STATE.parentsTimer >= 2.5) {
                        STATE.parents = 'atDoor';
                        STATE.parentsTimer = 0;
                        STATE.doorAlertTimer = 0;
                        const key = STATE.targetDoor;
                        const d = STATE.doors[key];
                        if (d.locked && d.lockTimer > 0) {
                            STATE.doorTimer = STATE.DOOR_OPEN_TIME;
                            setMessage(`🚪 ${key === 'left' ? '左' : '右'}门锁着！父母在开门...`, 'danger-text');
                            playSound('knock');
                        } else {
                            STATE.parents = 'inside';
                            STATE.parentsTimer = 0;
                            handleParentsEnter();
                        }
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'atDoor') {
                    const key = STATE.targetDoor;
                    const d = STATE.doors[key];
                    if (d.locked && d.lockTimer > 0) {
                        STATE.doorAlertTimer += dt;
                        if (STATE.doorAlertTimer >= STATE.DOOR_ALERT_INTERVAL) {
                            STATE.doorAlertTimer = 0;
                            addAlertness(STATE.DOOR_ALERT_AMOUNT, `父母发现${key === 'left' ? '左' : '右'}门锁了`);
                        }
                        STATE.doorTimer -= dt;
                        if (STATE.doorTimer <= 0) {
                            STATE.doorTimer = 0;
                            STATE.parents = 'inside';
                            STATE.parentsTimer = 0;
                            handleParentsEnter();
                            updateUI();
                            updateMessage();
                        }
                    } else {
                        STATE.parents = 'inside';
                        STATE.parentsTimer = 0;
                        handleParentsEnter();
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'inside') {
                    STATE.parentsTimer += dt;
                    if (STATE.phone === 'playing') {
                        addAlertness(30, '父母发现手机没藏！');
                        if (STATE.alertness >= 100) return;
                    }
                    if (STATE.parentsTimer >= STATE.PARENTS_STAY_TIME) {
                        STATE.parents = 'leaving';
                        STATE.parentsTimer = 0;
                        if (STATE.phone === 'hidden') {
                            playSound('safe');
                            setMessage('✅ 父母没发现手机！安全了！', 'success-text');
                        } else {
                            if (!STATE.gameOver) addAlertness(30, '父母发现手机没藏！');
                        }
                        setTimeout(() => {
                            if (!STATE.gameOver && !STATE.gameWon) {
                                STATE.parents = 'away';
                                STATE.parentsTimer = 0;
                                // 设置冷却
                                let minInt, maxInt;
                                if (STATE.mode === 'free') {
                                    minInt = 18;
                                    maxInt = 38;
                                } else {
                                    if (STATE.day <= 2) { minInt = 35;
                                        maxInt = 55; } else if (STATE.day <= 5) { minInt = 18;
                                        maxInt = 38; } else { minInt = 14;
                                        maxInt = 30; }
                                }
                                STATE.parentsCooldown = randomRange(minInt, maxInt);
                                updateUI();
                                updateMessage();
                                if (STATE.phone === 'hidden') {
                                    setMessage('🙈 手机还藏着，点击「玩手机」继续 📱', '');
                                }
                            }
                        }, 1200);
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'leaving') {
                    // 等待
                }
            }

            function handleParentsEnter() {
                if (STATE.phone === 'hidden') {
                    setMessage('✅ 手机藏好了！父母检查中...', 'success-text');
                    playSound('safe');
                } else {
                    setMessage('⚠️ 手机没藏！父母发现了！！', 'danger-text');
                    playSound('caught');
                    addAlertness(30, '父母发现手机没藏！');
                }
                updateUI();
            }

            // ---------- 响铃 ----------
            function startRing() {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return;
                if (STATE.phone !== 'hidden') return;
                if (STATE.ringActive) return;
                if (STATE.qteActive) return;
                STATE.ringActive = true;
                STATE.ringMuted = false;
                STATE.ringTimer = STATE.ringDuration;
                ringOverlay.classList.add('active');
                ringTimerBar.style.width = '100%';
                phoneCell.classList.add('ringing');
                playSound('ring');
                setMessage('📢 手机响了！按 X 静音！', 'danger-text');
                updateUI();
            }

            function updateRing(dt) {
                if (!STATE.ringActive) return;
                STATE.ringTimer -= dt;
                const pct = Math.max(0, (STATE.ringTimer / STATE.ringDuration) * 100);
                ringTimerBar.style.width = pct + '%';
                if (STATE.ringTimer <= 0 && !STATE.ringMuted) {
                    STATE.ringActive = false;
                    ringOverlay.classList.remove('active');
                    phoneCell.classList.remove('ringing');
                    if (STATE.parents === 'inside') {
                        addAlertness(20, '手机响铃 (父母在房间)');
                    } else {
                        addAlertness(10, '手机响铃');
                    }
                    STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                    updateUI();
                    updateMessage();
                } else if (STATE.ringTimer <= 0 && STATE.ringMuted) {
                    STATE.ringActive = false;
                    ringOverlay.classList.remove('active');
                    phoneCell.classList.remove('ringing');
                    setMessage('🔇 手机已静音！', 'success-text');
                    STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                    updateUI();
                    updateMessage();
                }
            }

            function muteRing() {
                if (!STATE.ringActive || STATE.ringMuted) return;
                STATE.ringMuted = true;
                STATE.ringTimer = 0;
                ringOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');
                playSound('mute');
                setMessage('🔇 成功静音！', 'success-text');
                updateUI();
                updateMessage();
            }

            function updateRingCooldown(dt) {
                if (STATE.ringActive) return;
                if (STATE.phone !== 'hidden') return;
                if (STATE.gameOver || STATE.gameWon) return;
                STATE.ringCooldown -= dt;
                if (STATE.ringCooldown <= 0) startRing();
            }

            // ---------- 快乐值增加（玩手机时） ----------
            function updateHappiness(dt) {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return;
                if (STATE.phone === 'playing') {
                    addHappiness(STATE.happyRate * dt);
                }
            }

            // ---------- UI ----------
            function updateUI() {
                timeDisplay.textContent = formatTime(STATE.time);
                dayDisplay.textContent = STATE.mode === 'seven' ? `第${STATE.day}晚` : '自由模式';
                livesDisplay.textContent = '❤️'.repeat(STATE.lives) + '🖤'.repeat(STATE.maxLives - STATE.lives);

                const isPlaying = STATE.phone === 'playing';
                phoneCell.className = 'room-item' + (isPlaying ? ' playing' : ' hidden');
                if (STATE.ringActive) phoneCell.classList.add('ringing');
                phoneStatus.textContent = isPlaying ? '📱 玩手机' : '🙈 已藏好';
                phoneStatus.className = 'sub' + (isPlaying ? ' active' : ' success');

                playerCell.className = 'room-item' + (STATE.phone === 'hidden' ? ' hidden-away' : '');
                playerStatus.textContent = STATE.phone === 'hidden' ? '🙈 藏手机' : '😴 睡觉';
                playerStatus.className = 'sub' + (STATE.phone === 'hidden' ? ' success' : '');

                const p = STATE.parents;
                let emoji = '🌫️',
                    statusText = '远离',
                    subClass = '';
                if (p === 'away') { emoji = '🌫️';
                    statusText = '远离'; } else if (p === 'approaching') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = '👣';
                    statusText = who + ' 接近中!';
                    subClass = 'danger';
                } else if (p === 'atDoor') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = who;
                    statusText = '在门口!';
                    subClass = 'danger';
                } else if (p === 'inside') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = who;
                    statusText = '已进入!';
                    subClass = 'danger';
                } else if (p === 'leaving') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = who;
                    statusText = '离开中';
                }
                parentsEmoji.textContent = emoji;
                parentsStatus.textContent = statusText;
                parentsStatus.className = 'sub' + (subClass ? ' ' + subClass : '');

                scene.className = (p === 'approaching' || p === 'atDoor' || p === 'inside') ? 'scene danger' : '';

                updateDoorUI();
                updateAlertUI();
                updateHappyUI();

                // 按钮
                const isGameOver = STATE.gameOver || STATE.gameWon;
                const isQTE = STATE.qteActive;
                const isLockAction = STATE.lockActionGlobal;
                const isParentsInside = STATE.parents === 'inside' || STATE.parents === 'leaving';
                const isRing = STATE.ringActive;
                const disableAll = isGameOver || isQTE || isLockAction || STATE.paused || isRing;
                const disableHide = disableAll || STATE.phone === 'hidden' || isParentsInside;
                const disablePlay = disableAll || isParentsInside;
                btnPlay.disabled = disablePlay;
                btnHide.disabled = disableHide;
                const lLocked = STATE.doors.left.locked && STATE.doors.left.lockTimer > 0;
                const rLocked = STATE.doors.right.locked && STATE.doors.right.lockTimer > 0;
                const lAction = STATE.doors.left.lockActionActive;
                const rAction = STATE.doors.right.lockActionActive;
                btnLockLeft.disabled = disableAll || lLocked || lAction || STATE.doorCooldown > 0;
                btnUnlockLeft.disabled = disableAll || !lLocked || lAction || STATE.doorCooldown > 0;
                if (STATE.mode === 'free' || STATE.day <= 5) {
                    btnLockRight.style.display = 'none';
                    btnUnlockRight.style.display = 'none';
                    document.getElementById('door-right').style.display = 'none';
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr';
                } else {
                    btnLockRight.style.display = 'flex';
                    btnUnlockRight.style.display = 'flex';
                    document.getElementById('door-right').style.display = 'flex';
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr 1fr';
                    btnLockRight.disabled = disableAll || rLocked || rAction || STATE.doorCooldown > 0;
                    btnUnlockRight.disabled = disableAll || !rLocked || rAction || STATE.doorCooldown > 0;
                }
                if ((STATE.parents === 'atDoor' || STATE.parents === 'inside') && !isGameOver && !isQTE && !isLockAction && !
                    STATE.paused && !isRing && STATE.phone !== 'hidden') {
                    btnHide.disabled = false;
                }
                updateMessage();
            }

            function updateMessage() {
                const p = STATE.parents;
                let msg = '';
                if (STATE.gameOver) msg = '💀 游戏结束...';
                else if (STATE.gameWon) {
                    if (STATE.mode === 'seven' && STATE.day >= STATE.maxDay) msg = '🎉 恭喜完成七天手机！';
                    else msg = '🎉 胜利！你玩到了12点！';
                } else if (STATE.qteActive) msg = '⌨️ 快速按方向键藏手机！';
                else if (STATE.ringActive) msg = '📢 手机响了！按 X 静音！';
                else if (p === 'away') {
                    if (STATE.phone === 'playing') msg = `📱 玩手机 (快乐值 ${Math.round(STATE.happiness)}/${STATE.happyTarget})`;
                    else msg = '🙈 手机藏好了，随时可能响...';
                } else if (p === 'approaching') {
                    const who = STATE.parentsType === 'parent' ? '👨👩 爸爸妈妈' : '👴👵 爷爷奶奶';
                    const doorSide = STATE.targetDoor === 'left' ? '左门' : '右门';
                    msg = `👣 ${who} 来了（${doorSide}）！快藏手机！`;
                } else if (p === 'atDoor') {
                    const key = STATE.targetDoor;
                    const d = STATE.doors[key];
                    if (d.locked && d.lockTimer > 0) {
                        const remain = Math.ceil(STATE.doorTimer);
                        msg = `🚪 父母在开门... 剩余 ${remain}秒！警觉值上升中！`;
                    } else msg = '🚪 门没锁！父母要进来了！！';
                } else if (p === 'inside') {
                    if (STATE.phone === 'hidden') msg = '✅ 手机藏好了！父母检查中... 小心手机响！';
                    else msg = '⚠️ 手机没藏！父母发现了！！';
                } else if (p === 'leaving') msg = '👋 父母走了... 安全了！';
                else msg = '🕹️ 玩手机到 24:00 胜利！';

                if (!STATE.gameOver && !STATE.gameWon && STATE.phone === 'hidden' && p === 'away' && !STATE.ringActive) {
                    msg = '🙈 手机已藏好，点击「玩手机」继续 📱';
                }
                // 显示目标
                if (STATE.mode === 'seven' && !STATE.gameOver && !STATE.gameWon) {
                    msg += ` (目标快乐值 ${STATE.happyTarget}%)`;
                }
                messageArea.innerHTML = msg;
            }

            function setMessage(text, className = '') {
                const span = document.createElement('span');
                span.textContent = text;
                if (className) span.className = className;
                messageArea.innerHTML = '';
                messageArea.appendChild(span);
            }

            // ---------- 核心循环 ----------
            function startGame(mode) {
                STATE.mode = mode;
                STATE.day = 1;
                STATE.time = 22 * 60;
                STATE.phone = 'playing';
                STATE.lives = STATE.maxLives;
                STATE.alertness = 0;
                STATE.alertnessDecayTimer = 0;
                STATE.gameOver = false;
                STATE.gameWon = false;
                STATE._gameOverTriggered = false;
                STATE.parents = 'away';
                STATE.parentsTimer = 0;
                STATE.doorTimer = 0;
                STATE.parentsStayTimer = 0;
                STATE.doorAlertTimer = 0;
                STATE.qteActive = false;
                STATE.qteSequence = [];
                STATE.qteIndex = 0;
                STATE.qteTimeLeft = 0;
                STATE.qteSuccess = false;
                STATE.qteDone = false;
                STATE.ringActive = false;
                STATE.ringTimer = 0;
                STATE.ringMuted = false;
                STATE.doorCooldown = 0;
                STATE.paused = false;
                STATE.lockActionGlobal = false;
                STATE.doors.left = { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false,
                    progress: 0 };
                STATE.doors.right = { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false,
                    progress: 0 };
                resetHappiness();
                setHappyTarget(STATE.day);
                // 设置冷却
                let minInt, maxInt;
                if (mode === 'free') { minInt = 18;
                    maxInt = 38; } else { minInt = 35;
                    maxInt = 55; } // 第一天简单
                STATE.parentsCooldown = randomRange(minInt, maxInt);
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);

                menuOverlay.classList.add('hidden');
                gameOverlay.classList.remove('active');
                qteOverlay.classList.remove('active');
                ringOverlay.classList.remove('active');
                lockActionOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');

                // 门显示
                if (mode === 'free' || STATE.day <= 5) {
                    document.getElementById('door-right').style.display = 'none';
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr';
                    btnLockRight.style.display = 'none';
                    btnUnlockRight.style.display = 'none';
                } else {
                    document.getElementById('door-right').style.display = 'flex';
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr 1fr';
                    btnLockRight.style.display = 'flex';
                    btnUnlockRight.style.display = 'flex';
                }

                updateUI();
                updateMessage();

                if (STATE.loopInterval) cancelAnimationFrame(STATE.loopInterval);
                STATE.lastTimestamp = performance.now();
                loop();
            }

            // 重置新的一天 (七天模式)
            function resetDay() {
                STATE.time = 22 * 60;
                STATE.phone = 'playing';
                STATE.alertness = 0;
                STATE.alertnessDecayTimer = 0;
                STATE.parents = 'away';
                STATE.parentsTimer = 0;
                STATE.doorTimer = 0;
                STATE.parentsStayTimer = 0;
                STATE.doorAlertTimer = 0;
                STATE.qteActive = false;
                STATE.qteSequence = [];
                STATE.qteIndex = 0;
                STATE.qteTimeLeft = 0;
                STATE.qteSuccess = false;
                STATE.qteDone = false;
                STATE.ringActive = false;
                STATE.ringTimer = 0;
                STATE.ringMuted = false;
                STATE.doorCooldown = 0;
                STATE.paused = false;
                STATE.lockActionGlobal = false;
                STATE.doors.left = { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false,
                    progress: 0 };
                STATE.doors.right = { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false,
                    progress: 0 };
                resetHappiness();
                setHappyTarget(STATE.day);
                // 重置冷却
                let minInt, maxInt;
                if (STATE.day <= 2) { minInt = 35;
                    maxInt = 55; } else if (STATE.day <= 5) { minInt = 18;
                    maxInt = 38; } else { minInt = 14;
                    maxInt = 30; }
                STATE.parentsCooldown = randomRange(minInt, maxInt);
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                // 恢复生命值？保持当前生命值（不重置）
                // 门显示
                if (STATE.day <= 5) {
                    document.getElementById('door-right').style.display = 'none';
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr';
                    btnLockRight.style.display = 'none';
                    btnUnlockRight.style.display = 'none';
                } else {
                    document.getElementById('door-right').style.display = 'flex';
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr 1fr';
                    btnLockRight.style.display = 'flex';
                    btnUnlockRight.style.display = 'flex';
                }
                updateUI();
                updateMessage();
            }

            function loop() {
                if (STATE.gameOver || STATE.gameWon) {
                    updateUI();
                    STATE.loopInterval = requestAnimationFrame(loop);
                    return;
                }

                const now = performance.now();
                const dt = Math.min((now - STATE.lastTimestamp) / 1000, 0.05);
                STATE.lastTimestamp = now;
                STATE.deltaTime = dt;

                if (!STATE.paused) {
                    STATE.time += dt / STATE.timeSpeed;
                    if (STATE.time >= STATE.targetTime) {
                        STATE.time = STATE.targetTime;
                        // 检查快乐值
                        if (STATE.mode === 'seven') {
                            if (checkHappyTarget()) {
                                // 过关
                                if (STATE.day >= STATE.maxDay) {
                                    // 完成所有天
                                    winGame('🎉 恭喜完成七天手机！', '你是手机大师！');
                                } else {
                                    // 进入下一天
                                    STATE.day++;
                                    // 恢复一条命？或者保留
                                    // 如果生命为0则结束？但这里生命>0才过关，所以不会为0
                                    resetDay();
                                    setMessage(`🌟 第${STATE.day}晚开始！`, 'success-text');
                                    updateUI();
                                    updateMessage();
                                    STATE.loopInterval = requestAnimationFrame(loop);
                                    return;
                                }
                            } else {
                                // 快乐值不达标
                                gameOver('😢 快乐值不足', `需要 ${STATE.happyTarget}% 快乐值，你只有 ${Math.round(STATE.happiness)}%`, '😞');
                            }
                        } else {
                            // 自由模式直接胜利
                            winGame('🎉 胜利！', '你玩到了12点！');
                        }
                        updateUI();
                        STATE.loopInterval = requestAnimationFrame(loop);
                        return;
                    }

                    decayAlertness(dt);
                    updateHappiness(dt);

                    if (STATE.doorCooldown > 0) {
                        STATE.doorCooldown -= dt;
                        if (STATE.doorCooldown < 0) STATE.doorCooldown = 0;
                    }

                    updateLockAction(dt);
                    updateDoorTimers(dt);
                    updateParents(dt);
                    updateRingCooldown(dt);
                    if (!STATE.ringActive) updateRing(dt);
                    else updateRing(dt);

                    updateUI();
                } else {
                    if (STATE.qteActive) updateQTETimer(dt);
                    if (STATE.ringActive) updateRing(dt);
                    if (STATE.lockActionGlobal) updateLockAction(dt);
                }

                STATE.loopInterval = requestAnimationFrame(loop);
            }

            // ---------- QTE ----------
            function startQTE() {
                if (STATE.qteActive || STATE.phone === 'hidden' || STATE.gameOver || STATE.gameWon || STATE.ringActive ||
                    STATE.lockActionGlobal) return;
                STATE.qteActive = true;
                STATE.paused = true;
                STATE.qteSuccess = false;
                STATE.qteDone = false;
                STATE.qteIndex = 0;
                STATE.qteTimeLeft = STATE.qteMaxTime;
                STATE.qteSequence = generateQTESequence(4);
                qteOverlay.classList.add('active');
                renderQTE();
                qteResult.textContent = '⏳ 输入方向...';
                qteTimerBar.style.width = '100%';
                qteTitle.textContent = '🙈 快速藏手机！';
                qteSubtitle.textContent = '按顺序点击方向键 (↑↓←→)';
                playSound('qte_start');
                updateUI();
            }

            function renderQTE() {
                qteSequence.innerHTML = '';
                STATE.qteSequence.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'qte-arrow';
                    if (index < STATE.qteIndex) div.classList.add('done');
                    if (index === STATE.qteIndex) div.classList.add('active');
                    div.textContent = item.emoji;
                    div.dataset.index = index;
                    qteSequence.appendChild(div);
                });
            }

            function updateQTETimer(dt) {
                if (!STATE.qteActive) return;
                STATE.qteTimeLeft -= dt;
                const pct = Math.max(0, (STATE.qteTimeLeft / STATE.qteMaxTime) * 100);
                qteTimerBar.style.width = pct + '%';
                if (STATE.qteTimeLeft <= 0 && !STATE.qteDone) qteFail('⏰ 时间到！');
            }

            function qteInput(key) {
                if (!STATE.qteActive || STATE.qteDone || STATE.qteIndex >= STATE.qteSequence.length) return;
                const expected = STATE.qteSequence[STATE.qteIndex];
                if (key === expected.key) {
                    STATE.qteIndex++;
                    renderQTE();
                    playSound('qte_correct');
                    if (STATE.qteIndex >= STATE.qteSequence.length) {
                        qteSuccess();
                    } else {
                        const arrows = qteSequence.querySelectorAll('.qte-arrow');
                        arrows.forEach((el, i) => {
                            el.className = 'qte-arrow';
                            if (i < STATE.qteIndex) el.classList.add('done');
                            if (i === STATE.qteIndex) el.classList.add('active');
                        });
                    }
                } else {
                    qteFail('❌ 按错了！');
                }
            }

            function qteSuccess() {
                if (STATE.qteDone) return;
                STATE.qteDone = true;
                STATE.qteSuccess = true;
                STATE.phone = 'hidden';
                qteResult.textContent = '✅ 藏好了！';
                qteResult.style.color = '#7bff9e';
                playSound('qte_success');
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                setTimeout(() => {
                    closeQTE();
                    setMessage('🙈 手机藏好了！注意手机可能会响！', 'success-text');
                    updateUI();
                    updateMessage();
                }, 600);
            }

            function qteFail(reason) {
                if (STATE.qteDone) return;
                STATE.qteDone = true;
                STATE.qteSuccess = false;
                qteResult.textContent = reason || '❌ 藏手机失败！';
                qteResult.style.color = '#ff7b89';
                playSound('qte_fail');
                const arrows = qteSequence.querySelectorAll('.qte-arrow');
                arrows.forEach(el => {
                    if (!el.classList.contains('done')) el.classList.add('wrong');
                });
                setTimeout(() => {
                    closeQTE();
                    setMessage('⚠️ 藏手机失败！快再试试！', 'danger-text');
                    updateUI();
                    updateMessage();
                }, 800);
            }

            function closeQTE() {
                STATE.qteActive = false;
                STATE.paused = false;
                qteOverlay.classList.remove('active');
                qteResult.style.color = '';
                updateUI();
                updateMessage();
            }

            // ---------- 玩家操作 ----------
            function actionPlay() {
                if (STATE.gameOver || STATE.gameWon || STATE.qteActive || STATE.paused || STATE.ringActive || STATE
                    .lockActionGlobal) return;
                if (STATE.parents === 'inside' || STATE.parents === 'leaving') return;
                STATE.phone = 'playing';
