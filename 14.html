<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创世 · Genesis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #0a0e1a;
            color: #d0d8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a6a9f;
            border-radius: 4px;
        }
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .app {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 14, 30, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(80, 140, 255, 0.15);
            border-radius: 16px;
            padding: 14px 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }
        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .title-group h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f6d365, #fda085, #f6d365);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .title-group .sub {
            font-size: 14px;
            color: #6a8abf;
            letter-spacing: 2px;
        }
        .universe-badge {
            font-size: 13px;
            background: rgba(255, 200, 100, 0.15);
            border: 1px solid rgba(255, 200, 100, 0.3);
            border-radius: 20px;
            padding: 2px 14px;
            color: #f0d080;
            margin-left: 8px;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            font-size: 15px;
        }
        .stats .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            background: rgba(30, 50, 90, 0.3);
            padding: 4px 14px 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(80, 140, 255, 0.08);
        }
        .stats .stat-item .label {
            color: #7a8aaa;
            font-size: 13px;
        }
        .stats .stat-item .value {
            font-weight: 600;
            font-size: 17px;
            color: #f0f4ff;
        }
        .stats .stat-item .value.quark-val {
            color: #ffd866;
        }
        .stats .stat-item .value.rate-val {
            color: #6fcf97;
        }
        .click-area {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }
        .click-btn {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 30% 30%, #4a7adf, #1a3a7a);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(60, 120, 255, 0.25), inset 0 -6px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            letter-spacing: 1px;
        }
        .click-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(60, 120, 255, 0.4), inset 0 -6px 0 rgba(0, 0, 0, 0.3);
        }
        .click-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 20px rgba(60, 120, 255, 0.5);
        }
        .click-btn .icon {
            font-size: 42px;
            line-height: 1;
        }
        .click-btn .sub-text {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 2px;
        }
        .click-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: ripple-anim 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        @media (max-width: 820px) {
            .columns {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .click-btn {
                width: 160px;
                height: 160px;
                font-size: 18px;
            }
            .click-btn .icon {
                font-size: 34px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .stats {
                justify-content: space-around;
            }
        }
        .panel {
            background: rgba(10, 14, 30, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(80, 140, 255, 0.1);
            border-radius: 16px;
            padding: 16px 16px 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(80, 140, 255, 0.08);
            margin-bottom: 12px;
        }
        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-header h2 .badge {
            font-size: 12px;
            background: rgba(80, 140, 255, 0.15);
            padding: 2px 12px;
            border-radius: 20px;
            color: #7a9fd0;
            font-weight: 400;
        }
        .panel-header .progress-text {
            font-size: 13px;
            color: #6a8abf;
        }
        .panel-scroll {
            max-height: 540px;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(20, 30, 60, 0.35);
            border: 1px solid rgba(80, 140, 255, 0.06);
            border-radius: 12px;
            padding: 8px 14px 8px 12px;
            transition: background 0.2s, border-color 0.2s, opacity 0.3s;
            cursor: default;
            min-height: 54px;
            flex-shrink: 0;
        }
        .card.unlocked {
            border-color: rgba(100, 200, 150, 0.2);
            background: rgba(30, 70, 50, 0.15);
        }
        .card.locked {
            opacity: 0.8;
            cursor: pointer;
        }
        .card.locked:hover {
            background: rgba(40, 70, 130, 0.25);
            border-color: rgba(80, 140, 255, 0.2);
        }
        .card .card-icon {
            font-size: 22px;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
            opacity: 0.8;
        }
        .card .card-info {
            flex: 1;
            min-width: 0;
        }
        .card .card-info .name {
            font-size: 14px;
            font-weight: 600;
            color: #e8eeff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card .card-info .name .tag {
            font-size: 10px;
            font-weight: 400;
            background: rgba(80, 140, 255, 0.12);
            padding: 0 8px;
            border-radius: 10px;
            color: #6a8abf;
        }
        .card .card-info .desc {
            font-size: 12px;
            color: #7a8aaa;
            margin-top: 1px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .card-info .effect-text {
            font-size: 12px;
            color: #6fcf97;
            margin-top: 2px;
        }
        .card .card-action {
            flex-shrink: 0;
            text-align: right;
            min-width: 72px;
        }
        .card .card-action .price {
            font-size: 13px;
            font-weight: 600;
            color: #ffd866;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .card .card-action .price .q-icon {
            font-size: 14px;
        }
        .card .card-action .status {
            font-size: 13px;
            color: #6fcf97;
            font-weight: 500;
        }
        .card .card-action .buy-btn {
            background: linear-gradient(135deg, #3a6acf, #2a4a9f);
            border: none;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 2px 10px rgba(60, 120, 255, 0.15);
            letter-spacing: 0.5px;
        }
        .card .card-action .buy-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(60, 120, 255, 0.3);
        }
        .card .card-action .buy-btn:active {
            transform: scale(0.94);
        }
        .card .card-action .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: #3a4a6a;
            letter-spacing: 0.5px;
            padding: 8px 0;
            border-top: 1px solid rgba(80, 140, 255, 0.05);
        }
        .footer .save-status {
            color: #4a6a8a;
            font-size: 11px;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 340px;
            pointer-events: none;
        }
        .toast {
            background: rgba(10, 14, 30, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 14px;
            padding: 14px 20px;
            color: #d0d8f0;
            font-size: 14px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            animation: slideIn 0.4s ease-out forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast .toast-icon {
            font-size: 24px;
        }
        .toast .toast-body {
            flex: 1;
        }
        .toast .toast-body strong {
            color: #ffd866;
        }
        .toast .toast-body .sub {
            font-size: 12px;
            color: #7a8aaa;
            display: block;
            margin-top: 2px;
        }
        .toast.exit {
            animation: slideOut 0.4s ease-in forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(60px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(60px) scale(0.92);
            }
        }
        .reset-btn {
            background: none;
            border: 1px solid rgba(200, 80, 80, 0.2);
            color: #6a4a4a;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-btn:hover {
            border-color: rgba(200, 80, 80, 0.5);
            color: #b06a6a;
            background: rgba(200, 80, 80, 0.05);
        }
        @media (max-width: 480px) {
            .stats .stat-item {
                padding: 2px 10px;
                font-size: 13px;
            }
            .stats .stat-item .value {
                font-size: 15px;
            }
            .card {
                padding: 6px 10px;
                min-height: 46px;
                gap: 6px;
            }
            .card .card-icon {
                font-size: 18px;
                width: 28px;
            }
            .card .card-info .name {
                font-size: 13px;
            }
            .card .card-action .buy-btn {
                font-size: 11px;
                padding: 3px 12px;
            }
            .panel-scroll {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    <div class="toast-container" id="toast-container"></div>

    <div class="app">

        <header class="header">
            <div class="title-group">
                <h1>✦ 创世</h1>
                <span class="sub">· Genesis</span>
                <span class="universe-badge" id="universe-badge">🌌 物质宇宙</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="label">夸克</span>
                    <span class="value quark-val" id="quark-display">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">每秒</span>
                    <span class="value rate-val" id="rate-display">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">点击</span>
                    <span class="value" id="click-display" style="color:#8ab8ff;">+1</span>
                </div>
                <button class="reset-btn" id="reset-btn" title="重新开始">⟳ 重置</button>
            </div>
        </header>

        <div class="click-area">
            <button class="click-btn" id="click-btn">
                <span class="icon">⚛</span>
                创造夸克
                <span class="sub-text" id="click-sub">+1 夸克</span>
            </button>
        </div>

        <div class="columns">
            <div class="panel" id="matter-panel">
                <div class="panel-header">
                    <h2>🧬 物质派系 <span class="badge">微观 → 宏观</span></h2>
                    <span class="progress-text" id="matter-progress">0 / 0</span>
                </div>
                <div class="panel-scroll" id="matter-list"></div>
            </div>
            <div class="panel" id="law-panel">
                <div class="panel-header">
                    <h2>📐 定律派系 <span class="badge">微观 → 宏观</span></h2>
                    <span class="progress-text" id="law-progress">0 / 0</span>
                </div>
                <div class="panel-scroll" id="law-list"></div>
            </div>
        </div>

        <div class="footer">
            <span class="save-status" id="save-status">⏺ 已自动保存</span>
            &nbsp;·&nbsp; 从夸克到宇宙 · 创世之旅
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================

        const MATTER_DATA = [
            { id: 'quark', name: '夸克', icon: '⚛', desc: '构成物质的基本粒子', basePrice: 0, effect: 3, unlocked: true },
            { id: 'gluon', name: '胶子', icon: '🌀', desc: '传递强相互作用的玻色子', basePrice: 80, effect: 2 },
            { id: 'hadron', name: '强子', icon: '🔵', desc: '由夸克组成的复合粒子', basePrice: 380, effect: 5 },
            { id: 'nucleus', name: '原子核', icon: '🔴', desc: '原子中心的致密核心', basePrice: 1500, effect: 14 },
            { id: 'electron', name: '电子', icon: '⚡', desc: '带负电的轻子，绕核运动', basePrice: 4200, effect: 38 },
            { id: 'neutrino', name: '中微子', icon: '🌊', desc: '几乎不参与相互作用的轻子', basePrice: 8500, effect: 65 },
            { id: 'atom', name: '原子', icon: '🌌', desc: '化学变化中的最小粒子', basePrice: 18000, effect: 120 },
            { id: 'molecule', name: '分子', icon: '🧪', desc: '原子通过化学键结合而成', basePrice: 42000, effect: 240 },
            { id: 'compound', name: '化合物', icon: '🧬', desc: '不同元素组成的纯净物', basePrice: 100000, effect: 480 },
            { id: 'organic', name: '有机物', icon: '🌿', desc: '含碳的化合物，生命基础', basePrice: 250000, effect: 1000 },
            { id: 'cell', name: '细胞', icon: '🧫', desc: '生命的基本结构和功能单位', basePrice: 600000, effect: 2200 },
            { id: 'tissue', name: '组织', icon: '🧵', desc: '同类细胞组成的结构', basePrice: 1400000, effect: 5000 },
            { id: 'organ', name: '器官', icon: '❤️', desc: '由不同组织构成的特定功能结构', basePrice: 3200000, effect: 12000 },
            { id: 'organism', name: '生物体', icon: '🧍', desc: '具有生命特征的个体', basePrice: 7500000, effect: 28000 },
            { id: 'population', name: '种群', icon: '👥', desc: '同种生物的个体集合', basePrice: 18000000, effect: 65000 },
            { id: 'ecosystem', name: '生态系统', icon: '🌍', desc: '生物群落与非生物环境的总和', basePrice: 42000000, effect: 150000 },
            { id: 'planet', name: '星球', icon: '🪐', desc: '绕恒星运行的天体', basePrice: 100000000, effect: 380000 },
            { id: 'star', name: '恒星', icon: '⭐', desc: '由等离子体构成的发光天体', basePrice: 250000000, effect: 900000 },
            { id: 'galaxy', name: '星系', icon: '🌌', desc: '由恒星、星云等组成的系统', basePrice: 600000000, effect: 2200000 },
            { id: 'cluster', name: '星团', icon: '✨', desc: '大量星系组成的集团', basePrice: 1500000000, effect: 5500000 },
            { id: 'supercluster', name: '超星系团', icon: '🌟', desc: '星团组成的更大结构', basePrice: 3800000000, effect: 14000000 },
            { id: 'universe', name: '宇宙', icon: '🌠', desc: '一切存在的总和', basePrice: 9000000000, effect: 35000000 },
            // ★ 新增：真空衰变
            { id: 'vacuum_decay', name: '真空衰变', icon: '💥', desc: '引发真空衰变，宇宙重置为反物质版本', basePrice: 12000000000,
            effect: 0 },
        ];

        const LAW_DATA = [
            { id: 'confinement', name: '夸克禁闭', icon: '🔗', desc: '夸克不能单独存在', basePrice: 120, effect: { type: 'clickMult',
                    value: 2 } },
            { id: 'strong', name: '强力', icon: '💥', desc: '将夸克束缚在强子内', basePrice: 600, effect: { type: 'prodMult',
                    value: 1.5 } },
            { id: 'weak', name: '弱力', icon: '☢️', desc: '引起放射性衰变的力', basePrice: 2400, effect: { type: 'prodBonus',
                    value: 18 } },
            { id: 'emforce', name: '电磁力', icon: '🧲', desc: '带电粒子间的相互作用', basePrice: 8000, effect: { type: 'clickMult',
                    value: 2 } },
            { id: 'fluctuation', name: '量子涨落', icon: '🌊', desc: '真空中虚粒子对的产生与湮灭', basePrice: 20000, effect: { type: 'random',
                    value: 150 } },
            { id: 'parity', name: '不平衡宇称', icon: '🔄', desc: '弱相互作用中宇称不守恒', basePrice: 50000, effect: { type: 'prodMult',
                    value: 1.5 } },
            { id: 'tunneling', name: '量子隧穿', icon: '🌀', desc: '粒子穿过势垒的量子现象', basePrice: 120000, effect: { type: 'clickMult',
                    value: 3 } },
            { id: 'gravity', name: '引力', icon: '🌐', desc: '万有引力，长程相互作用', basePrice: 300000, effect: { type: 'prodMult',
                    value: 1.5 } },
            { id: 'relativity', name: '相对论', icon: '⏳', desc: '时空与引力的本质', basePrice: 750000, effect: { type: 'prodMult',
                    value: 2 } },
            { id: 'quantum', name: '量子力学', icon: '🎲', desc: '微观世界的物理理论', basePrice: 2000000, effect: { type: 'clickMult',
                    value: 5 } },
            { id: 'thermo', name: '热力学', icon: '🔥', desc: '热运动与能量转换的规律', basePrice: 5000000, effect: { type: 'prodMult',
                    value: 2 } },
            { id: 'entropy', name: '熵', icon: '♾️', desc: '系统无序程度的量度', basePrice: 12000000, effect: { type: 'prodBonus',
                    value: 120000 } },
            { id: 'evolution', name: '进化论', icon: '🧬', desc: '物种演变的自然选择', basePrice: 30000000, effect: { type: 'prodMult',
                    value: 2 } },
            { id: 'ecology', name: '生态学', icon: '🌱', desc: '生物与环境相互关系的科学', basePrice: 80000000, effect: { type: 'prodMult',
                    value: 3 } },
            { id: 'cosmology', name: '宇宙学', icon: '🔭', desc: '研究宇宙起源与演化的学科', basePrice: 200000000, effect: { type: 'prodMult',
                    value: 5 } },
            { id: 'string', name: '弦理论', icon: '🎻', desc: '万物由一维弦构成的理论', basePrice: 500000000, effect: { type: 'clickMult',
                    value: 10 } },
            { id: 'entanglement', name: '量子纠缠', icon: '🔮', desc: '粒子间超越距离的关联', basePrice: 1200000000, effect: { type: 'prodMult',
                    value: 5 } },
            { id: 'uncertainty', name: '不确定性原理', icon: '❓', desc: '位置与动量不可同时确定', basePrice: 4000000000, effect: { type: 'prodMult',
                    value: 10 } },
        ];

        // ============================================================
        //  GAME STATE
        // ============================================================

        const game = {
            quarks: 0,
            totalQuarks: 0,
            clickPower: 1,
            quarksPerSecond: 0,
            matterUnlocked: MATTER_DATA.map(() => false),
            lawUnlocked: LAW_DATA.map(() => false),
            isAntimatter: false, // 新增：宇宙类型
        };
        game.matterUnlocked[0] = true; // 夸克初始解锁

        let lawClickMult = 1;
        let lawProdMult = 1;
        let lawProdBonus = 0;
        let lawRandomChance = 0;
        let lawRandomAmount = 0;
        let lastTime = Date.now();

        // ============================================================
        //  HELPERS
        // ============================================================

        function formatNum(n) {
            if (n < 0) return '-' + formatNum(-n);
            if (n < 10) return n.toFixed(1);
            if (n < 1000) return Math.floor(n).toString();
            if (n < 1e6) return (n / 1e3).toFixed(1) + 'K';
            if (n < 1e9) return (n / 1e6).toFixed(1) + 'M';
            if (n < 1e12) return (n / 1e9).toFixed(1) + 'B';
            if (n < 1e15) return (n / 1e12).toFixed(1) + 'T';
            return n.toExponential(2);
        }

        function formatInt(n) {
            if (n < 0) return '-' + formatInt(-n);
            if (n < 1000) return Math.floor(n).toString();
            if (n < 1e6) return (n / 1e3).toFixed(1) + 'K';
            if (n < 1e9) return (n / 1e6).toFixed(1) + 'M';
            if (n < 1e12) return (n / 1e9).toFixed(1) + 'B';
            if (n < 1e15) return (n / 1e12).toFixed(1) + 'T';
            return n.toExponential(2);
        }

        // ============================================================
        //  CORE LOGIC
        // ============================================================

        function recalcStats() {
            let prod = 0;
            for (let i = 0; i < MATTER_DATA.length; i++) {
                if (game.matterUnlocked[i]) {
                    prod += MATTER_DATA[i].effect;
                }
            }
            prod = prod * lawProdMult + lawProdBonus;
            game.quarksPerSecond = prod;

            let click = 1 * lawClickMult;
            game.clickPower = click;

            document.getElementById('click-display').textContent = '+' + formatInt(click);
            document.getElementById('click-sub').textContent = '+' + formatInt(click) + ' 夸克';
            return prod;
        }

        function getPrice(item, idx, isLaw) {
            const base = item.basePrice;
            if (base === 0) return 0;
            const unlocked = isLaw ? game.lawUnlocked : game.matterUnlocked;
            if (unlocked[idx]) return -1;
            const count = unlocked.filter(Boolean).length;
            const mult = 1 + count * 0.18;
            return Math.floor(base * mult);
        }

        function canAfford(price) {
            return price >= 0 && game.quarks >= price;
        }

        // 重置宇宙（切换类型）
        function resetUniverse(toAntimatter) {
            // 保存当前真空衰变解锁状态（因为调用前可能已经设置为true）
            const vacuumIdx = MATTER_DATA.length - 1;
            const vacuumUnlocked = game.matterUnlocked[vacuumIdx];

            // 重置所有物质解锁（仅保留夸克）
            for (let i = 0; i < MATTER_DATA.length; i++) {
                game.matterUnlocked[i] = (i === 0);
            }
            // 重置所有定律解锁
            for (let i = 0; i < LAW_DATA.length; i++) {
                game.lawUnlocked[i] = false;
            }
            // 恢复真空衰变解锁状态（如果之前已解锁）
            if (vacuumUnlocked) {
                game.matterUnlocked[vacuumIdx] = true;
            }

            // 重置数值
            game.quarks = 0;
            game.totalQuarks = 0;

            // 重置加成
            lawClickMult = 1;
            lawProdMult = 1;
            lawProdBonus = 0;
            lawRandomChance = 0;
            lawRandomAmount = 0;

            // 切换宇宙类型
            game.isAntimatter = toAntimatter;

            // 重新计算
            recalcStats();
            // 保存
            saveGame();
            // 重新渲染
            renderAll();
            // 更新宇宙徽章
            updateUniverseBadge();
        }

        // 解锁物质（特殊处理真空衰变）
        function unlockMatter(idx) {
            if (game.matterUnlocked[idx]) return false;
            const item = MATTER_DATA[idx];
            const price = getPrice(item, idx, false);
            if (price < 0 || game.quarks < price) return false;

            // 检查是否为真空衰变（最后一项）
            if (idx === MATTER_DATA.length - 1) {
                // 扣费
                game.quarks -= price;
                // 标记已解锁（防止重复触发）
                game.matterUnlocked[idx] = true;
                // 执行重置，切换到反物质宇宙
                resetUniverse(true);
                showToast('💥', '真空衰变！', '宇宙已重置为反物质版本');
                saveGame();
                return true;
            }

            // 普通物质解锁
            game.quarks -= price;
            game.matterUnlocked[idx] = true;
            recalcStats();
            renderAll();
            showToast('🧬', `解锁了 <strong>${item.name}</strong>`, `${item.desc}  · 产量 +${item.effect}/秒`);
            saveGame();
            checkMilestone(item.name);
            return true;
        }

        function unlockLaw(idx) {
            if (game.lawUnlocked[idx]) return false;
            const item = LAW_DATA[idx];
            const price = getPrice(item, idx, true);
            if (price < 0 || game.quarks < price) return false;
            game.quarks -= price;
            game.lawUnlocked[idx] = true;
            applyLawEffect(item);
            recalcStats();
            renderAll();
            showToast('📐', `解锁了 <strong>${item.name}</strong>`, `${item.desc}  · 获得特殊加成`);
            saveGame();
            checkMilestone(item.name);
            return true;
        }

        function applyLawEffect(item) {
            const e = item.effect;
            if (e.type === 'clickMult') {
                lawClickMult *= e.value;
            } else if (e.type === 'prodMult') {
                lawProdMult *= e.value;
            } else if (e.type === 'prodBonus') {
                lawProdBonus += e.value;
            } else if (e.type === 'random') {
                lawRandomChance = 0.05;
                lawRandomAmount = e.value;
            }
        }

        function reapplyAllLaws() {
            lawClickMult = 1;
            lawProdMult = 1;
            lawProdBonus = 0;
            lawRandomChance = 0;
            lawRandomAmount = 0;
            for (let i = 0; i < LAW_DATA.length; i++) {
                if (game.lawUnlocked[i]) {
                    applyLawEffect(LAW_DATA[i]);
                }
            }
            recalcStats();
        }

        // ============================================================
        //  CLICK
        // ============================================================

        function handleClick(e) {
            const amount = game.clickPower;
            game.quarks += amount;
            game.totalQuarks += amount;

            if (lawRandomChance > 0 && Math.random() < lawRandomChance) {
                const bonus = Math.floor(lawRandomAmount * (0.5 + Math.random()));
                game.quarks += bonus;
                game.totalQuarks += bonus;
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML =
                    `<span class="toast-icon">🌊</span><div class="toast-body">量子涨落！额外获得 <strong>+${formatInt(bonus)}</strong> 夸克</div>`;
                document.getElementById('toast-container').appendChild(toast);
                setTimeout(() => { toast.classList.add('exit');
                    setTimeout(() => toast.remove(), 400); }, 1600);
            }

            const btn = document.getElementById('click-btn');
            const rect = btn.getBoundingClientRect();
            const cx = (e.clientX || e.pageX) - rect.left;
            const cy = (e.clientY || e.pageY) - rect.top;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.min(rect.width, rect.height) * 0.6;
            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';
            ripple.style.left = (cx - size / 2) + 'px';
            ripple.style.top = (cy - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);

            updateDisplay();
            updateCardStates();
        }

        // ============================================================
        //  RENDER
        // ============================================================

        // 根据宇宙类型调整显示内容
        function getDisplayItem(item, isLaw) {
            const name = item.name;
            const icon = item.icon;
            const desc = item.desc;
            if (game.isAntimatter) {
                // 反物质宇宙：名称加“反”，图标加⚡标记，描述加前缀
                // 真空衰变特殊处理：显示为“已触发”状态
                if (item.id === 'vacuum_decay') {
                    return {
                        name: '真空衰变 (已触发)',
                        icon: '💥',
                        desc: '宇宙已切换为反物质版本'
                    };
                }
                return {
                    name: '反' + name,
                    icon: '⚡' + icon,
                    desc: '反物质：' + desc
                };
            } else {
                return { name, icon, desc };
            }
        }

        function renderMatter() {
            const container = document.getElementById('matter-list');
            container.innerHTML = '';
            let unlockedCount = 0;
            MATTER_DATA.forEach((item, idx) => {
                const unlocked = game.matterUnlocked[idx];
                if (unlocked) unlockedCount++;
                const price = getPrice(item, idx, false);
                const display = getDisplayItem(item, false);
                const card = document.createElement('div');
                card.className = 'card ' + (unlocked ? 'unlocked' : 'locked');
                card.dataset.idx = idx;
                card.dataset.type = 'matter';

                const icon = document.createElement('span');
                icon.className = 'card-icon';
                icon.textContent = display.icon;

                const info = document.createElement('div');
                info.className = 'card-info';
                const nameSpan = document.createElement('div');
                nameSpan.className = 'name';
                nameSpan.innerHTML = display.name + (unlocked ? ' <span class="tag">✓ 已解锁</span>' : '');
                const descSpan = document.createElement('div');
                descSpan.className = 'desc';
                descSpan.textContent = display.desc;
                info.appendChild(nameSpan);
                info.appendChild(descSpan);
                if (unlocked && item.effect > 0) {
                    const eff = document.createElement('div');
                    eff.className = 'effect-text';
                    eff.textContent = '⚡ +' + item.effect + ' /秒';
                    info.appendChild(eff);
                }

                const action = document.createElement('div');
                action.className = 'card-action';
                if (unlocked) {
                    const status = document.createElement('span');
                    status.className = 'status';
                    status.textContent = (item.id === 'vacuum_decay') ? '✦ 已触发' : '✦ 已创生';
                    action.appendChild(status);
                } else {
                    const priceSpan = document.createElement('div');
                    priceSpan.className = 'price';
                    priceSpan.innerHTML = `<span class="q-icon">⚛</span> ${formatInt(price)}`;
                    const btn = document.createElement('button');
                    btn.className = 'buy-btn';
                    btn.textContent = (item.id === 'vacuum_decay') ? '触发' : '创造';
                    btn.disabled = !canAfford(price);
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (idx === 0) return;
                        unlockMatter(idx);
                    });
                    action.appendChild(priceSpan);
                    action.appendChild(btn);
                }

                card.appendChild(icon);
                card.appendChild(info);
                card.appendChild(action);

                if (!unlocked && idx !== 0) {
                    card.addEventListener('click', () => {
                        unlockMatter(idx);
                    });
                }

                container.appendChild(card);
            });
            document.getElementById('matter-progress').textContent = `${unlockedCount} / ${MATTER_DATA.length}`;
        }

        function renderLaw() {
            const container = document.getElementById('law-list');
            container.innerHTML = '';
            let unlockedCount = 0;
            LAW_DATA.forEach((item, idx) => {
                const unlocked = game.lawUnlocked[idx];
                if (unlocked) unlockedCount++;
                const price = getPrice(item, idx, true);
                const display = getDisplayItem(item, true);
                const card = document.createElement('div');
                card.className = 'card ' + (unlocked ? 'unlocked' : 'locked');
                card.dataset.idx = idx;
                card.dataset.type = 'law';

                const icon = document.createElement('span');
                icon.className = 'card-icon';
                icon.textContent = display.icon;

                const info = document.createElement('div');
                info.className = 'card-info';
                const nameSpan = document.createElement('div');
                nameSpan.className = 'name';
                nameSpan.innerHTML = display.name + (unlocked ? ' <span class="tag">✓ 已解锁</span>' : '');
                const descSpan = document.createElement('div');
                descSpan.className = 'desc';
                descSpan.textContent = display.desc;
                info.appendChild(nameSpan);
                info.appendChild(descSpan);
                if (unlocked) {
                    const eff = document.createElement('div');
                    eff.className = 'effect-text';
                    const e = item.effect;
                    let txt = '';
                    if (e.type === 'clickMult') txt = '🖱 点击 ×' + e.value;
                    else if (e.type === 'prodMult') txt = '📈 产量 ×' + e.value;
                    else if (e.type === 'prodBonus') txt = '⚡ 产量 +' + formatInt(e.value) + '/秒';
                    else if (e.type === 'random') txt = '🎲 随机获得 ' + formatInt(e.value) + ' 夸克';
                    eff.textContent = txt;
                    info.appendChild(eff);
                }

                const action = document.createElement('div');
                action.className = 'card-action';
                if (unlocked) {
                    const status = document.createElement('span');
                    status.className = 'status';
                    status.textContent = '✦ 已揭示';
                    action.appendChild(status);
                } else {
                    const priceSpan = document.createElement('div');
                    priceSpan.className = 'price';
                    priceSpan.innerHTML = `<span class="q-icon">⚛</span> ${formatInt(price)}`;
                    const btn = document.createElement('button');
                    btn.className = 'buy-btn';
                    btn.textContent = '揭示';
                    btn.disabled = !canAfford(price);
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        unlockLaw(idx);
                    });
                    action.appendChild(priceSpan);
                    action.appendChild(btn);
                }

                card.appendChild(icon);
                card.appendChild(info);
                card.appendChild(action);

                if (!unlocked) {
                    card.addEventListener('click', () => {
                        unlockLaw(idx);
                    });
                }

                container.appendChild(card);
            });
            document.getElementById('law-progress').textContent = `${unlockedCount} / ${LAW_DATA.length}`;
        }

        function updateCardStates() {
            renderMatter();
            renderLaw();
        }

        function updateDisplay() {
            document.getElementById('quark-display').textContent = formatNum(game.quarks);
            document.getElementById('rate-display').textContent = formatNum(game.quarksPerSecond);
            document.getElementById('click-display').textContent = '+' + formatInt(game.clickPower);
            document.getElementById('click-sub').textContent = '+' + formatInt(game.clickPower) + ' 夸克';
        }

        function updateUniverseBadge() {
            const badge = document.getElementById('universe-badge');
            if (game.isAntimatter) {
                badge.textContent = '⚡ 反物质宇宙';
                badge.style.borderColor = 'rgba(255,100,200,0.5)';
                badge.style.color = '#ff8ac0';
            } else {
                badge.textContent = '🌌 物质宇宙';
                badge.style.borderColor = 'rgba(255,200,100,0.3)';
                badge.style.color = '#f0d080';
            }
        }

        function renderAll() {
            renderMatter();
            renderLaw();
            updateDisplay();
            updateUniverseBadge();
        }

        // ============================================================
        //  TOAST
        // ============================================================

        function showToast(icon, title, sub) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <div class="toast-body">
                    ${title}
                    <span class="sub">${sub}</span>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('exit');
                setTimeout(() => toast.remove(), 400);
            }, 2200);
        }

        // ============================================================
        //  MILESTONE
        // ============================================================

        const milestoneMap = {
            '夸克': '⚛ 万物起源',
            '原子': '🌌 物质基础',
            '分子': '🧪 化学之始',
            '细胞': '🧫 生命萌芽',
            '生态系统': '🌍 生命家园',
            '星系': '🌌 星辰大海',
            '宇宙': '🌠 终极疆域',
            '量子力学': '🎲 不确定的世界',
            '相对论': '⏳ 时空弯曲',
            '进化论': '🧬 生命之树',
            '宇宙学': '🔭 仰望星空',
        };

        function checkMilestone(name) {
            const msg = milestoneMap[name];
            if (msg) {
                showToast('🏆', `里程碑：${msg}`, `你揭示了「${name}」的秘密！`);
            }
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================

        function gameLoop() {
            const now = Date.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            const safeDt = Math.min(dt, 0.5);
            if (safeDt > 0) {
                game.quarks += game.quarksPerSecond * safeDt;
                game.totalQuarks += game.quarksPerSecond * safeDt;
                updateDisplay();
                if (Math.floor(now / 500) !== Math.floor((now - 50) / 500)) {
                    updateCardStates();
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  SAVE / LOAD
        // ============================================================

        function saveGame() {
            try {
                const data = {
                    quarks: game.quarks,
                    totalQuarks: game.totalQuarks,
                    matterUnlocked: game.matterUnlocked,
                    lawUnlocked: game.lawUnlocked,
                    isAntimatter: game.isAntimatter,
                    timestamp: Date.now(),
                };
                localStorage.setItem('genesis_save', JSON.stringify(data));
                document.getElementById('save-status').textContent = '⏺ 已保存 ' + new Date().toLocaleTimeString();
            } catch (e) { /* ignore */ }
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem('genesis_save');
                if (!raw) return false;
                const data = JSON.parse(raw);
                game.quarks = data.quarks || 0;
                game.totalQuarks = data.totalQuarks || 0;
                if (data.matterUnlocked) {
                    for (let i = 0; i < Math.min(data.matterUnlocked.length, MATTER_DATA.length); i++) {
                        game.matterUnlocked[i] = data.matterUnlocked[i];
                    }
                }
                if (data.lawUnlocked) {
                    for (let i = 0; i < Math.min(data.lawUnlocked.length, LAW_DATA.length); i++) {
                        game.lawUnlocked[i] = data.lawUnlocked[i];
                    }
                }
                game.isAntimatter = data.isAntimatter || false;
                game.matterUnlocked[0] = true; // 确保夸克解锁
                reapplyAllLaws();
                recalcStats();
                renderAll();
                document.getElementById('save-status').textContent = '⏺ 加载存档 ' + new Date(data.timestamp).toLocaleTimeString();
                return true;
            } catch (e) {
                return false;
            }
        }

        setInterval(saveGame, 15000);

        // ============================================================
        //  RESET
        // ============================================================

        function resetGame() {
            if (!confirm('确定要重置一切吗？所有进度将丢失！')) return;
            localStorage.removeItem('genesis_save');
            game.quarks = 0;
            game.totalQuarks = 0;
            game.matterUnlocked = MATTER_DATA.map(() => false);
            game.lawUnlocked = LAW_DATA.map(() => false);
            game.matterUnlocked[0] = true;
            game.isAntimatter = false;
            lawClickMult = 1;
            lawProdMult = 1;
            lawProdBonus = 0;
            lawRandomChance = 0;
            lawRandomAmount = 0;
            recalcStats();
            renderAll();
            showToast('🔄', '世界重置', '一切回归混沌，重新开始创世之旅');
            saveGame();
        }

        // ============================================================
        //  STARS BACKGROUND
        // ============================================================

        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, stars = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const count = Math.floor((w * h) / 1800);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: 0.3 + Math.random() * 1.2,
                    a: 0.3 + Math.random() * 0.7,
                    speed: 0.002 + Math.random() * 0.008,
                    phase: Math.random() * Math.PI * 2,
                });
            }

            function drawStars(time) {
                ctx.clearRect(0, 0, w, h);
                for (const s of stars) {
                    const alpha = s.a * (0.6 + 0.4 * Math.sin(time * s.speed + s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(220, 235, 255, ${alpha})`;
                    ctx.fill();
                }
                requestAnimationFrame(drawStars);
            }
            requestAnimationFrame(drawStars);
        }

        // ============================================================
        //  INIT
        // ============================================================

        function init() {
            initStars();

            const loaded = loadGame();
            if (!loaded) {
                game.matterUnlocked[0] = true;
                reapplyAllLaws();
                recalcStats();
                renderAll();
                showToast('✨', '欢迎来到 <strong>创世</strong>', '点击「⚛ 创造夸克」开始你的宇宙之旅');
            }

            document.getElementById('click-btn').addEventListener('click', handleClick);
            document.getElementById('reset-btn').addEventListener('click', resetGame);

            lastTime = Date.now();
            requestAnimationFrame(gameLoop);

            setInterval(() => {
                updateCardStates();
            }, 2000);

            window.addEventListener('beforeunload', () => {
                saveGame();
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
