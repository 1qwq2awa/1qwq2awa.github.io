            <div id="game-overlay">
                <div class="big-emoji" id="result-emoji">😭</div>
                <div class="title" id="result-title">被抓到了！</div>
                <div class="subtitle" id="result-sub">手机被没收了...</div>
                <div class="detail" id="result-detail">坚持了 0 分钟</div>
                <button class="restart-btn" id="restart-btn">🔄 再来一次</button>
            </div>
        </div>

        <!-- ===== 操作按钮 ===== -->
        <div id="actions">
            <button class="action-btn primary" id="btn-play" title="玩手机">
                <span class="emoji">📱</span>
                <span class="label">玩手机</span>
            </button>
            <button class="action-btn danger" id="btn-hide" title="藏手机 (QTE)">
                <span class="emoji">🙈</span>
                <span class="label">藏手机</span>
            </button>
            <button class="action-btn warning" id="btn-lock-left" title="锁左门">
                <span class="emoji">🔒</span>
                <span class="label">锁左门</span>
            </button>
            <button class="action-btn" id="btn-unlock-left" title="开左门">
                <span class="emoji">🔓</span>
                <span class="label">开左门</span>
            </button>
            <button class="action-btn warning" id="btn-lock-right" title="锁右门" style="display:none;">
                <span class="emoji">🔒</span>
                <span class="label">锁右门</span>
            </button>
            <button class="action-btn" id="btn-unlock-right" title="开右门" style="display:none;">
                <span class="emoji">🔓</span>
                <span class="label">开右门</span>
            </button>
        </div>

        <!-- 底部小提示 -->
        <div style="text-align:center;font-size:11px;color:rgba(255,255,255,0.15);padding-top:10px;letter-spacing:0.5px;">
            ⌨️ 1玩 2藏 · 3锁左门 4开左门 · 5锁右门 6开右门 · ↑↓←→ QTE · <kbd>X</kbd> 静音
        </div>
    </div>

    <script>
        // ============================================================
        //  游戏主逻辑 - 快乐值系统
        // ============================================================

        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const $ = id => document.getElementById(id);
            const timeDisplay = $('time-display');
            const livesDisplay = $('lives-display');
            const scene = $('scene');
            const phoneCell = $('phone-cell');
            const phoneStatus = $('phone-status');
            const playerCell = $('player-cell');
            const playerStatus = $('player-status');
            const parentsEmoji = $('parents-emoji');
            const parentsStatus = $('parents-status');
            const messageArea = $('message-area');
            const qteOverlay = $('qte-overlay');
            const qteSequence = $('qte-sequence');
            const qteTimerBar = $('qte-timer-bar');
            const qteResult = $('qte-result');
            const qteTitle = $('qte-title');
            const qteSubtitle = $('qte-subtitle');
            const gameOverlay = $('game-overlay');
            const resultEmoji = $('result-emoji');
            const resultTitle = $('result-title');
            const resultSub = $('result-sub');
            const resultDetail = $('result-detail');
            const restartBtn = $('restart-btn');
            const ringOverlay = $('ring-overlay');
            const ringTimerBar = $('ring-timer-bar');
            const alertnessBar = $('alertness-bar');
            const alertnessText = $('alertness-text');
            const happinessBar = $('happiness-bar');
            const happinessText = $('happiness-text');
            const menuOverlay = $('menu-overlay');
            const roomGrid = $('room-grid');
            const doorLeft = $('door-left');
            const doorRight = $('door-right');
            const doorLeftLabel = $('door-left-label');
            const doorRightLabel = $('door-right-label');
            const doorLeftProgress = $('door-left-progress-bar');
            const doorRightProgress = $('door-right-progress-bar');
            const lockActionOverlay = $('lock-action-overlay');
            const lockActionBar = $('lock-action-bar');
            const lockActionRemain = $('lock-action-remain');

            const btnPlay = $('btn-play');
            const btnHide = $('btn-hide');
            const btnLockLeft = $('btn-lock-left');
            const btnUnlockLeft = $('btn-unlock-left');
            const btnLockRight = $('btn-lock-right');
            const btnUnlockRight = $('btn-unlock-right');

            // ---------- 游戏状态 ----------
            const STATE = {
                difficulty: 'normal',
                time: 22 * 60,
                targetTime: 24 * 60,
                phone: 'playing',
                lives: 3,
                alertness: 0,
                happiness: 0,
                happinessTarget: 80, // 需要达到80%快乐值
                happinessDecayTimer: 0,
                alertnessDecayTimer: 0,
                gameOver: false,
                gameWon: false,
                _gameOverTriggered: false,

                doors: {
                    left: { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false, progress: 0 },
                    right: { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false, progress: 0 }
                },
                LOCK_ACTION_DURATION: 5,
                LOCK_DURATION: 30,

                parents: 'away',
                parentsTimer: 0,
                parentsCooldown: 0,
                parentsType: 'parent',
                targetDoor: 'left',

                doorTimer: 0,
                DOOR_OPEN_TIME: 5,
                parentsStayTimer: 0,
                PARENTS_STAY_TIME: 2.5,
                doorAlertTimer: 0,
                DOOR_ALERT_INTERVAL: 2.0,
                DOOR_ALERT_AMOUNT: 5,

                qteActive: false,
                qteSequence: [],
                qteIndex: 0,
                qteTimeLeft: 0,
                qteMaxTime: 3.0,
                qteSuccess: false,
                qteDone: false,

                ringActive: false,
                ringTimer: 0,
                ringCooldown: 0,
                ringDuration: 3.0,
                ringMinInterval: 8,
                ringMaxInterval: 15,
                ringMuted: false,

                loopInterval: null,
                deltaTime: 0,
                lastTimestamp: 0,
                timeSpeed: 2.0,

                parentsMinInterval: 18,
                parentsMaxInterval: 38,

                doorCooldown: 0,
                paused: false,
                lockActionGlobal: false,

                // 快乐值积累速度 (每秒增加)
                happinessRate: 3.0, // 每秒 +3%
            };

            // ---------- 工具函数 ----------
            function formatTime(minutes) {
                const h = Math.floor(minutes / 60);
                const m = Math.floor(minutes % 60);
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function randomRange(min, max) { return Math.random() * (max - min) + min; }

            function randomInt(min, max) { return Math.floor(randomRange(min, max + 1)); }

            function generateQTESequence(length = 4) {
                const dirs = ['↑', '↓', '←', '→'];
                const map = { '↑': 'ArrowUp', '↓': 'ArrowDown', '←': 'ArrowLeft', '→': 'ArrowRight' };
                const seq = [];
                for (let i = 0; i < length; i++) {
                    const d = dirs[randomInt(0, 3)];
                    seq.push({ emoji: d, key: map[d] });
                }
                return seq;
            }

            // ---------- 快乐值系统 ----------
            function updateHappinessUI() {
                const val = STATE.happiness;
                happinessBar.style.width = val + '%';
                happinessText.textContent = Math.round(val) + '%';
                // 颜色变化：绿->黄->红
                if (val < 40) {
                    happinessBar.style.background = 'linear-gradient(90deg, #7bff9e, #a0f7a0)';
                } else if (val < 70) {
                    happinessBar.style.background = 'linear-gradient(90deg, #f7e9a0, #f7d07a)';
                } else {
                    happinessBar.style.background = 'linear-gradient(90deg, #ffb07c, #ff7b89)';
                }
            }

            function addHappiness(amount) {
                if (STATE.gameOver || STATE.gameWon) return;
                STATE.happiness = clamp(STATE.happiness + amount, 0, 100);
                updateHappinessUI();
            }

            // 快乐值自然衰减 (当不玩手机时缓慢下降)
            function decayHappiness(dt) {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return;
                if (STATE.phone === 'playing') {
                    // 玩手机时增加快乐值
                    addHappiness(STATE.happinessRate * dt);
                } else {
                    // 不玩手机时缓慢衰减
                    STATE.happinessDecayTimer += dt;
                    if (STATE.happinessDecayTimer >= 5.0) {
                        STATE.happinessDecayTimer = 0;
                        if (STATE.happiness > 0) {
                            STATE.happiness = clamp(STATE.happiness - 2, 0, 100);
                            updateHappinessUI();
                        }
                    }
                }
            }

            // ---------- 警觉值 ----------
            function addAlertness(amount, reason = '') {
                if (STATE.gameOver || STATE.gameWon) return;
                STATE.alertness = clamp(STATE.alertness + amount, 0, 100);
                updateAlertnessUI();
                if (STATE.alertness >= 100) {
                    STATE.alertness = 100;
                    gameOver('⚠️ 父母起疑了！', '警觉值达到100%... 手机被没收！', '😰');
                }
                if (reason && !STATE.gameOver) {
                    setMessage(`⚠️ 警觉 +${amount}% (${reason})`, 'danger-text');
                }
            }

            function updateAlertnessUI() {
                const val = STATE.alertness;
                alertnessBar.style.width = val + '%';
                alertnessText.textContent = Math.round(val) + '%';
                if (val < 30) {
                    alertnessBar.style.background = 'linear-gradient(90deg, #7bff9e, #a0f7a0)';
                } else if (val < 60) {
                    alertnessBar.style.background = 'linear-gradient(90deg, #f7e9a0, #f7d07a)';
                } else {
                    alertnessBar.style.background = 'linear-gradient(90deg, #ffb07c, #ff7b89)';
                }
            }

            function decayAlertness(dt) {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return;
                STATE.alertnessDecayTimer += dt;
                if (STATE.alertnessDecayTimer >= 10.0) {
                    STATE.alertnessDecayTimer = 0;
                    if (STATE.alertness > 0) {
                        STATE.alertness = clamp(STATE.alertness - 3, 0, 100);
                        updateAlertnessUI();
                    }
                }
            }

            // ---------- 门管理 ----------
            function getDoor(doorKey) { return STATE.doors[doorKey] || STATE.doors.left; }

            function isDoorLocked(doorKey) {
                const d = getDoor(doorKey);
                return d.locked && d.lockTimer > 0;
            }

            function lockDoor(doorKey) {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return false;
                const d = getDoor(doorKey);
                if (d.lockActionActive) return false;
                if (isDoorLocked(doorKey)) return false;
                d.lockActionActive = true;
                d.lockActionTimer = STATE.LOCK_ACTION_DURATION;
                d.progress = 0;
                showLockAction(doorKey);
                playSound('lock_start');
                return true;
            }

            function updateLockAction(dt) {
                for (const key of ['left', 'right']) {
                    const d = STATE.doors[key];
                    if (d.lockActionActive) {
                        d.lockActionTimer -= dt;
                        d.progress = 1 - (d.lockActionTimer / STATE.LOCK_ACTION_DURATION);
                        if (key === 'left') {
                            doorLeftProgress.style.width = (d.progress * 100) + '%';
                        } else {
                            doorRightProgress.style.width = (d.progress * 100) + '%';
                        }
                        if (STATE.lockActionGlobal && lockActionOverlay.classList.contains('active')) {
                            lockActionBar.style.width = (d.progress * 100) + '%';
                            lockActionRemain.textContent = Math.ceil(d.lockActionTimer);
                        }
                        if (d.lockActionTimer <= 0) {
                            d.lockActionActive = false;
                            d.locked = true;
                            d.lockTimer = STATE.LOCK_DURATION;
                            d.progress = 1;
                            if (key === 'left') {
                                doorLeftProgress.style.width = '100%';
                            } else {
                                doorRightProgress.style.width = '100%';
                            }
                            hideLockAction();
                            playSound('lock');
                            setMessage(`🔒 ${key === 'left' ? '左' : '右'}门已锁 (30秒)`, '');
                            updateDoorUI();
                            updateUI();
                        }
                    }
                }
            }

            function showLockAction(doorKey) {
                STATE.lockActionGlobal = true;
                lockActionOverlay.classList.add('active');
                lockActionBar.style.width = '0%';
                lockActionRemain.textContent = STATE.LOCK_ACTION_DURATION;
                STATE.paused = true;
                updateUI();
            }

            function hideLockAction() {
                STATE.lockActionGlobal = false;
                lockActionOverlay.classList.remove('active');
                STATE.paused = false;
                updateUI();
            }

            function updateDoorTimers(dt) {
                for (const key of ['left', 'right']) {
                    const d = STATE.doors[key];
                    if (d.locked && d.lockTimer > 0) {
                        d.lockTimer -= dt;
                        if (d.lockTimer <= 0) {
                            d.locked = false;
                            d.lockTimer = 0;
                            if (key === 'left') {
                                doorLeftProgress.style.width = '0%';
                            } else {
                                doorRightProgress.style.width = '0%';
                            }
                            setMessage(`🔓 ${key === 'left' ? '左' : '右'}门自动解锁`, '');
                            playSound('unlock');
                            updateDoorUI();
                            updateUI();
                        }
                    }
                }
            }

            function updateDoorUI() {
                const left = STATE.doors.left;
                const right = STATE.doors.right;
                doorLeftLabel.textContent = left.locked ? '🔒 已锁' : '🔓 未锁';
                doorRightLabel.textContent = right.locked ? '🔒 已锁' : '🔓 未锁';
                if (!left.lockActionActive) {
                    doorLeftProgress.style.width = (left.locked && left.lockTimer > 0) ? '100%' : '0%';
                }
                if (!right.lockActionActive) {
                    doorRightProgress.style.width = (right.locked && right.lockTimer > 0) ? '100%' : '0%';
                }
                doorLeft.classList.toggle('shaking', STATE.parents === 'atDoor' && STATE.targetDoor === 'left');
                doorRight.classList.toggle('shaking', STATE.parents === 'atDoor' && STATE.targetDoor === 'right');
            }

            // ---------- 父母AI ----------
            function updateParents(dt) {
                if (STATE.gameOver || STATE.gameWon) return;

                const p = STATE.parents;

                if (p === 'away') {
                    STATE.parentsTimer += dt;
                    if (STATE.parentsTimer >= STATE.parentsCooldown) {
                        if (STATE.difficulty === 'easy') {
                            STATE.parentsType = 'parent';
                            STATE.targetDoor = 'left';
                        } else if (STATE.difficulty === 'normal') {
                            STATE.parentsType = 'parent';
                            STATE.targetDoor = 'left';
                        } else {
                            if (Math.random() < 0.5) {
                                STATE.parentsType = 'parent';
                                STATE.targetDoor = 'left';
                            } else {
                                STATE.parentsType = 'grandparent';
                                STATE.targetDoor = 'right';
                            }
                        }
                        STATE.parents = 'approaching';
                        STATE.parentsTimer = 0;
                        STATE.parentsCooldown = 0;
                        playSound('footstep');
                        const who = STATE.parentsType === 'parent' ? '👨👩 爸爸妈妈' : '👴👵 爷爷奶奶';
                        const doorSide = STATE.targetDoor === 'left' ? '左门' : '右门';
                        setMessage(`👣 ${who} 来了（${doorSide}）！`, 'danger-text');
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'approaching') {
                    STATE.parentsTimer += dt;
                    if (STATE.parentsTimer >= 2.5) {
                        STATE.parents = 'atDoor';
                        STATE.parentsTimer = 0;
                        STATE.doorAlertTimer = 0;
                        const doorKey = STATE.targetDoor;
                        const d = STATE.doors[doorKey];
                        if (d.locked && d.lockTimer > 0) {
                            STATE.doorTimer = STATE.DOOR_OPEN_TIME;
                            setMessage(`🚪 ${doorKey === 'left' ? '左' : '右'}门锁着！父母在开门...`, 'danger-text');
                            playSound('knock');
                        } else {
                            STATE.parents = 'inside';
                            STATE.parentsTimer = 0;
                            handleParentsEnter();
                        }
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'atDoor') {
                    const doorKey = STATE.targetDoor;
                    const d = STATE.doors[doorKey];
                    if (d.locked && d.lockTimer > 0) {
                        STATE.doorAlertTimer += dt;
                        if (STATE.doorAlertTimer >= STATE.DOOR_ALERT_INTERVAL) {
                            STATE.doorAlertTimer = 0;
                            addAlertness(STATE.DOOR_ALERT_AMOUNT, `父母发现${doorKey === 'left' ? '左' : '右'}门锁了`);
                        }
                        STATE.doorTimer -= dt;
                        if (STATE.doorTimer <= 0) {
                            STATE.doorTimer = 0;
                            STATE.parents = 'inside';
                            STATE.parentsTimer = 0;
                            handleParentsEnter();
                            updateUI();
                            updateMessage();
                        }
                    } else {
                        STATE.parents = 'inside';
                        STATE.parentsTimer = 0;
                        handleParentsEnter();
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'inside') {
                    STATE.parentsTimer += dt;
                    if (STATE.phone === 'playing') {
                        addAlertness(30, '父母发现手机没藏！');
                        if (STATE.alertness >= 100) return;
                    }
                    if (STATE.parentsTimer >= STATE.PARENTS_STAY_TIME) {
                        STATE.parents = 'leaving';
                        STATE.parentsTimer = 0;
                        if (STATE.phone === 'hidden') {
                            playSound('safe');
                            setMessage('✅ 父母没发现手机！安全了！', 'success-text');
                        } else {
                            if (!STATE.gameOver) {
                                addAlertness(30, '父母发现手机没藏！');
                            }
                        }
                        setTimeout(() => {
                            if (!STATE.gameOver && !STATE.gameWon) {
                                STATE.parents = 'away';
                                STATE.parentsTimer = 0;
                                let minInt, maxInt;
                                if (STATE.difficulty === 'easy') {
                                    minInt = 35;
                                    maxInt = 55;
                                } else if (STATE.difficulty === 'normal') {
                                    minInt = 18;
                                    maxInt = 38;
                                } else {
                                    minInt = 14;
                                    maxInt = 30;
                                }
                                STATE.parentsCooldown = randomRange(minInt, maxInt);
                                updateUI();
                                updateMessage();
                                if (STATE.phone === 'hidden') {
                                    setMessage('🙈 手机还藏着，点击「玩手机」继续 📱', '');
                                }
                            }
                        }, 1200);
                        updateUI();
                        updateMessage();
                    }
                } else if (p === 'leaving') {
                    // wait
                }
            }

            function handleParentsEnter() {
                if (STATE.phone === 'hidden') {
                    setMessage('✅ 手机藏好了！父母检查中...', 'success-text');
                    playSound('safe');
                } else {
                    setMessage('⚠️ 手机没藏！父母发现了！！', 'danger-text');
                    playSound('caught');
                    addAlertness(30, '父母发现手机没藏！');
                }
                updateUI();
            }

            // ---------- 响铃系统 ----------
            function startRing() {
                if (STATE.gameOver || STATE.gameWon || STATE.paused) return;
                if (STATE.phone !== 'hidden') return;
                if (STATE.ringActive) return;
                if (STATE.qteActive) return;

                STATE.ringActive = true;
                STATE.ringMuted = false;
                STATE.ringTimer = STATE.ringDuration;
                ringOverlay.classList.add('active');
                ringTimerBar.style.width = '100%';
                phoneCell.classList.add('ringing');
                playSound('ring');
                setMessage('📢 手机响了！按 X 静音！', 'danger-text');
                updateUI();
            }

            function updateRing(dt) {
                if (!STATE.ringActive) return;
                STATE.ringTimer -= dt;
                const pct = Math.max(0, (STATE.ringTimer / STATE.ringDuration) * 100);
                ringTimerBar.style.width = pct + '%';

                if (STATE.ringTimer <= 0 && !STATE.ringMuted) {
                    STATE.ringActive = false;
                    ringOverlay.classList.remove('active');
                    phoneCell.classList.remove('ringing');
                    if (STATE.parents === 'inside') {
                        addAlertness(20, '手机响铃 (父母在房间)');
                    } else {
                        addAlertness(10, '手机响铃');
                    }
                    STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                    updateUI();
                    updateMessage();
                } else if (STATE.ringTimer <= 0 && STATE.ringMuted) {
                    STATE.ringActive = false;
                    ringOverlay.classList.remove('active');
                    phoneCell.classList.remove('ringing');
                    setMessage('🔇 手机已静音！', 'success-text');
                    STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                    updateUI();
                    updateMessage();
                }
            }

            function muteRing() {
                if (!STATE.ringActive) return;
                if (STATE.ringMuted) return;
                STATE.ringMuted = true;
                STATE.ringTimer = 0;
                ringOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');
                playSound('mute');
                setMessage('🔇 成功静音！', 'success-text');
                updateUI();
                updateMessage();
            }

            function updateRingCooldown(dt) {
                if (STATE.ringActive) return;
                if (STATE.phone !== 'hidden') return;
                if (STATE.gameOver || STATE.gameWon) return;

                STATE.ringCooldown -= dt;
                if (STATE.ringCooldown <= 0) {
                    startRing();
                }
            }

            // ---------- UI 更新 ----------
            function updateUI() {
                timeDisplay.textContent = formatTime(STATE.time);
                livesDisplay.textContent = '❤️'.repeat(STATE.lives) + '🖤'.repeat(3 - STATE.lives);

                const isPlaying = STATE.phone === 'playing';
                phoneCell.className = 'room-item' + (isPlaying ? ' playing' : ' hidden');
                if (STATE.ringActive) phoneCell.classList.add('ringing');
                phoneStatus.textContent = isPlaying ? '📱 玩手机' : '🙈 已藏好';
                phoneStatus.className = 'sub' + (isPlaying ? ' active' : ' success');

                playerCell.className = 'room-item' + (STATE.phone === 'hidden' ? ' hidden-away' : '');
                playerStatus.textContent = STATE.phone === 'hidden' ? '🙈 藏手机' : '😴 睡觉';
                playerStatus.className = 'sub' + (STATE.phone === 'hidden' ? ' success' : '');

                const p = STATE.parents;
                let emoji = '🌫️';
                let statusText = '远离';
                let subClass = '';
                if (p === 'away') {
                    emoji = '🌫️';
                    statusText = '远离';
                } else if (p === 'approaching') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = '👣';
                    statusText = who + ' 接近中!';
                    subClass = 'danger';
                } else if (p === 'atDoor') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = who;
                    statusText = '在门口!';
                    subClass = 'danger';
                } else if (p === 'inside') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = who;
                    statusText = '已进入!';
                    subClass = 'danger';
                } else if (p === 'leaving') {
                    const who = STATE.parentsType === 'parent' ? '👨👩' : '👴👵';
                    emoji = who;
                    statusText = '离开中';
                }
                parentsEmoji.textContent = emoji;
                parentsStatus.textContent = statusText;
                parentsStatus.className = 'sub' + (subClass ? ' ' + subClass : '');

                scene.className = (p === 'approaching' || p === 'atDoor' || p === 'inside') ? 'scene danger' : '';

                updateDoorUI();

                const isGameOver = STATE.gameOver || STATE.gameWon;
                const isQTE = STATE.qteActive;
                const isLockAction = STATE.lockActionGlobal;
                const isParentsInside = STATE.parents === 'inside' || STATE.parents === 'leaving';
                const isParentsAtDoor = STATE.parents === 'atDoor';
                const isRing = STATE.ringActive;

                const disableAll = isGameOver || isQTE || isLockAction || STATE.paused || isRing;
                const disableHide = disableAll || STATE.phone === 'hidden' || isParentsInside;
                const disablePlay = disableAll || isParentsInside;

                btnPlay.disabled = disablePlay;
                btnHide.disabled = disableHide;

                const leftLocked = STATE.doors.left.locked && STATE.doors.left.lockTimer > 0;
                const rightLocked = STATE.doors.right.locked && STATE.doors.right.lockTimer > 0;
                const leftAction = STATE.doors.left.lockActionActive;
                const rightAction = STATE.doors.right.lockActionActive;

                btnLockLeft.disabled = disableAll || leftLocked || leftAction || STATE.doorCooldown > 0;
                btnUnlockLeft.disabled = disableAll || !leftLocked || leftAction || STATE.doorCooldown > 0;
                if (STATE.difficulty === 'hard') {
                    btnLockRight.style.display = 'flex';
                    btnUnlockRight.style.display = 'flex';
                    btnLockRight.disabled = disableAll || rightLocked || rightAction || STATE.doorCooldown > 0;
                    btnUnlockRight.disabled = disableAll || !rightLocked || rightAction || STATE.doorCooldown > 0;
                } else {
                    btnLockRight.style.display = 'none';
                    btnUnlockRight.style.display = 'none';
                }

                if ((isParentsAtDoor || isParentsInside) && !isGameOver && !isQTE && !isLockAction && !STATE.paused && !isRing &&
                    STATE.phone !== 'hidden') {
                    btnHide.disabled = false;
                }

                updateHappinessUI();
                updateAlertnessUI();
                updateMessage();
            }

            function updateMessage() {
                const p = STATE.parents;
                let msg = '';

                if (STATE.gameOver) {
                    msg = '💀 游戏结束...';
                } else if (STATE.gameWon) {
                    msg = '🎉 胜利！你玩到了12点！';
                } else if (STATE.qteActive) {
                    msg = '⌨️ 快速按方向键藏手机！';
                } else if (STATE.ringActive) {
                    msg = '📢 手机响了！按 X 静音！';
                } else if (p === 'away') {
                    if (STATE.phone === 'playing') {
                        msg = '📱 玩手机增加快乐值！注意父母！';
                    } else {
                        msg = '🙈 手机藏好了，快乐值会缓慢下降...';
                    }
                } else if (p === 'approaching') {
                    const who = STATE.parentsType === 'parent' ? '👨👩 爸爸妈妈' : '👴👵 爷爷奶奶';
                    const doorSide = STATE.targetDoor === 'left' ? '左门' : '右门';
                    msg = `👣 ${who} 来了（${doorSide}）！快藏手机！`;
                } else if (p === 'atDoor') {
                    const doorKey = STATE.targetDoor;
                    const d = STATE.doors[doorKey];
                    if (d.locked && d.lockTimer > 0) {
                        const remain = Math.ceil(STATE.doorTimer);
                        msg = `🚪 父母在开门... 剩余 ${remain}秒！警觉值上升中！`;
                    } else {
                        msg = '🚪 门没锁！父母要进来了！！';
                    }
                } else if (p === 'inside') {
                    if (STATE.phone === 'hidden') {
                        msg = '✅ 手机藏好了！父母检查中... 小心手机响！';
                    } else {
                        msg = '⚠️ 手机没藏！父母发现了！！';
                    }
                } else if (p === 'leaving') {
                    msg = '👋 父母走了... 安全了！';
                } else {
                    msg = '🕹️ 玩手机到 24:00 并达到80%快乐值！';
                }

                if (!STATE.gameOver && !STATE.gameWon && STATE.phone === 'hidden' && p === 'away' && !STATE.ringActive) {
                    msg = '🙈 手机已藏好，点击「玩手机」继续 📱';
                }

                messageArea.innerHTML = msg;
            }

            function setMessage(text, className = '') {
                const span = document.createElement('span');
                span.textContent = text;
                if (className) span.className = className;
                messageArea.innerHTML = '';
                messageArea.appendChild(span);
            }

            // ---------- 核心循环 ----------
            function startGame(difficulty) {
                STATE.difficulty = difficulty;

                STATE.time = 22 * 60;
                STATE.phone = 'playing';
                STATE.lives = 3;
                STATE.alertness = 0;
                STATE.happiness = 0;
                STATE.happinessDecayTimer = 0;
                STATE.alertnessDecayTimer = 0;
                STATE.gameOver = false;
                STATE.gameWon = false;
                STATE._gameOverTriggered = false;
                STATE.parents = 'away';
                STATE.parentsTimer = 0;
                STATE.parentsCooldown = 0;
                STATE.doorTimer = 0;
                STATE.parentsStayTimer = 0;
                STATE.doorAlertTimer = 0;
                STATE.qteActive = false;
                STATE.qteSequence = [];
                STATE.qteIndex = 0;
                STATE.qteTimeLeft = 0;
                STATE.qteSuccess = false;
                STATE.qteDone = false;
                STATE.ringActive = false;
                STATE.ringTimer = 0;
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                STATE.ringMuted = false;
                STATE.doorCooldown = 0;
                STATE.paused = false;
                STATE.lockActionGlobal = false;
                STATE.doors.left = { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false, progress: 0 };
                STATE.doors.right = { locked: false, lockTimer: 0, lockActionTimer: 0, lockActionActive: false, progress: 0 };

                let minInt, maxInt;
                if (difficulty === 'easy') {
                    minInt = 35;
                    maxInt = 55;
                } else if (difficulty === 'normal') {
                    minInt = 18;
                    maxInt = 38;
                } else {
                    minInt = 14;
                    maxInt = 30;
                }
                STATE.parentsCooldown = randomRange(minInt, maxInt);

                menuOverlay.classList.add('hidden');
                gameOverlay.classList.remove('active');
                qteOverlay.classList.remove('active');
                ringOverlay.classList.remove('active');
                lockActionOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');

                if (difficulty === 'hard') {
                    document.getElementById('game').classList.add('hard-mode');
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr 1fr';
                } else {
                    document.getElementById('game').classList.remove('hard-mode');
                    roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr';
                }

                updateUI();
                updateMessage();

                if (STATE.loopInterval) {
                    cancelAnimationFrame(STATE.loopInterval);
                }
                STATE.lastTimestamp = performance.now();
                loop();
            }

            function loop() {
                if (STATE.gameOver || STATE.gameWon) {
                    updateUI();
                    STATE.loopInterval = requestAnimationFrame(loop);
                    return;
                }

                const now = performance.now();
                const dt = Math.min((now - STATE.lastTimestamp) / 1000, 0.05);
                STATE.lastTimestamp = now;
                STATE.deltaTime = dt;

                if (!STATE.paused) {
                    STATE.time += dt / STATE.timeSpeed;
                    if (STATE.time >= STATE.targetTime) {
                        STATE.time = STATE.targetTime;
                        // 检查快乐值是否达标
                        if (STATE.happiness >= STATE.happinessTarget) {
                            winGame();
                        } else {
                            // 快乐值不足，失败
                            gameOver('😔 快乐值不足', `只达到 ${Math.round(STATE.happiness)}%，需要 ${STATE.happinessTarget}%`, '😞');
                        }
                        updateUI();
                        STATE.loopInterval = requestAnimationFrame(loop);
                        return;
                    }

                    // 快乐值系统
                    decayHappiness(dt);
                    // 警觉值衰减
                    decayAlertness(dt);

                    if (STATE.doorCooldown > 0) {
                        STATE.doorCooldown -= dt;
                        if (STATE.doorCooldown < 0) STATE.doorCooldown = 0;
                    }

                    updateLockAction(dt);
                    updateDoorTimers(dt);

                    updateParents(dt);

                    updateRingCooldown(dt);
                    if (!STATE.ringActive) {
                        updateRing(dt);
                    } else {
                        updateRing(dt);
                    }

                    updateUI();
                } else {
                    if (STATE.qteActive) {
                        updateQTETimer(dt);
                    }
                    if (STATE.ringActive) {
                        updateRing(dt);
                    }
                    if (STATE.lockActionGlobal) {
                        updateLockAction(dt);
                    }
                }

                STATE.loopInterval = requestAnimationFrame(loop);
            }

            // ---------- QTE ----------
            function startQTE() {
                if (STATE.qteActive) return;
                if (STATE.phone === 'hidden') return;
                if (STATE.gameOver || STATE.gameWon) return;
                if (STATE.ringActive) return;
                if (STATE.lockActionGlobal) return;

                STATE.qteActive = true;
                STATE.paused = true;
                STATE.qteSuccess = false;
                STATE.qteDone = false;
                STATE.qteIndex = 0;
                STATE.qteTimeLeft = STATE.qteMaxTime;
                STATE.qteSequence = generateQTESequence(4);

                qteOverlay.classList.add('active');
                renderQTE();
                qteResult.textContent = '⏳ 输入方向...';
                qteTimerBar.style.width = '100%';
                qteTitle.textContent = '🙈 快速藏手机！';
                qteSubtitle.textContent = '按顺序点击方向键 (↑↓←→)';

                playSound('qte_start');
                updateUI();
            }

            function renderQTE() {
                qteSequence.innerHTML = '';
                STATE.qteSequence.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'qte-arrow';
                    if (index < STATE.qteIndex) div.classList.add('done');
                    if (index === STATE.qteIndex) div.classList.add('active');
                    div.textContent = item.emoji;
                    div.dataset.index = index;
                    qteSequence.appendChild(div);
                });
            }

            function updateQTETimer(dt) {
                if (!STATE.qteActive) return;
                STATE.qteTimeLeft -= dt;
                const pct = Math.max(0, (STATE.qteTimeLeft / STATE.qteMaxTime) * 100);
                qteTimerBar.style.width = pct + '%';

                if (STATE.qteTimeLeft <= 0 && !STATE.qteDone) {
                    qteFail('⏰ 时间到！');
                }
            }

            function qteInput(key) {
                if (!STATE.qteActive || STATE.qteDone) return;
                if (STATE.qteIndex >= STATE.qteSequence.length) return;

                const expected = STATE.qteSequence[STATE.qteIndex];
                if (key === expected.key) {
                    STATE.qteIndex++;
                    renderQTE();
                    playSound('qte_correct');

                    if (STATE.qteIndex >= STATE.qteSequence.length) {
                        qteSuccess();
                    } else {
                        const arrows = qteSequence.querySelectorAll('.qte-arrow');
                        arrows.forEach((el, i) => {
                            el.className = 'qte-arrow';
                            if (i < STATE.qteIndex) el.classList.add('done');
                            if (i === STATE.qteIndex) el.classList.add('active');
                        });
                    }
                } else {
                    qteFail('❌ 按错了！');
                }
            }

            function qteSuccess() {
                if (STATE.qteDone) return;
                STATE.qteDone = true;
                STATE.qteSuccess = true;
                STATE.phone = 'hidden';
                qteResult.textContent = '✅ 藏好了！';
                qteResult.style.color = '#7bff9e';
                playSound('qte_success');
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);

                setTimeout(() => {
                    closeQTE();
                    setMessage('🙈 手机藏好了！注意手机可能会响！', 'success-text');
                    updateUI();
                    updateMessage();
                }, 600);
            }

            function qteFail(reason) {
                if (STATE.qteDone) return;
                STATE.qteDone = true;
                STATE.qteSuccess = false;
                qteResult.textContent = reason || '❌ 藏手机失败！';
                qteResult.style.color = '#ff7b89';
                playSound('qte_fail');

                const arrows = qteSequence.querySelectorAll('.qte-arrow');
                arrows.forEach(el => {
                    if (!el.classList.contains('done')) {
                        el.classList.add('wrong');
                    }
                });

                setTimeout(() => {
                    closeQTE();
                    setMessage('⚠️ 藏手机失败！快再试试！', 'danger-text');
                    updateUI();
                    updateMessage();
                }, 800);
            }

            function closeQTE() {
                STATE.qteActive = false;
                STATE.paused = false;
                qteOverlay.classList.remove('active');
                qteResult.style.color = '';
                updateUI();
                updateMessage();
            }

            // ---------- 玩家操作 ----------
            function actionPlay() {
                if (STATE.gameOver || STATE.gameWon || STATE.qteActive || STATE.paused || STATE.ringActive || STATE
                    .lockActionGlobal) return;
                if (STATE.parents === 'inside' || STATE.parents === 'leaving') return;

                STATE.phone = 'playing';
                playSound('click');
                setMessage('📱 玩手机中... 快乐值上升', '');
                STATE.ringCooldown = randomRange(STATE.ringMinInterval, STATE.ringMaxInterval);
                if (STATE.ringActive) {
                    muteRing();
                }
                updateUI();
                updateMessage();
            }

            function actionHide() {
                if (STATE.gameOver || STATE.gameWon || STATE.paused || STATE.ringActive || STATE.lockActionGlobal) return;
                if (STATE.phone === 'hidden') {
                    setMessage('🙈 手机已经藏好了', '');
                    return;
                }
                startQTE();
            }

            function actionLock(doorKey) {
                if (STATE.gameOver || STATE.gameWon || STATE.qteActive || STATE.paused || STATE.ringActive) return;
                if (STATE.lockActionGlobal) return;
                const d = STATE.doors[doorKey];
                if (d.locked && d.lockTimer > 0) return;
                if (d.lockActionActive) return;
                if (STATE.doorCooldown > 0) return;
                lockDoor(doorKey);
                STATE.doorCooldown = 0.3;
            }

            function actionUnlock(doorKey) {
                if (STATE.gameOver || STATE.gameWon || STATE.qteActive || STATE.paused || STATE.ringActive) return;
                if (STATE.lockActionGlobal) return;
                const d = STATE.doors[doorKey];
                if (!d.locked || d.lockTimer <= 0) return;
                if (d.lockActionActive) return;
                if (STATE.doorCooldown > 0) return;

                d.locked = false;
                d.lockTimer = 0;
                d.progress = 0;
                if (doorKey === 'left') {
                    doorLeftProgress.style.width = '0%';
                } else {
                    doorRightProgress.style.width = '0%';
                }
                STATE.doorCooldown = 0.3;
                playSound('unlock');
                setMessage(`🔓 ${doorKey === 'left' ? '左' : '右'}门已打开`, '');
                updateDoorUI();
                updateUI();
                updateMessage();

                if (STATE.parents === 'atDoor' && STATE.targetDoor === doorKey) {
                    STATE.parents = 'inside';
                    STATE.parentsTimer = 0;
                    handleParentsEnter();
                    updateUI();
                    updateMessage();
                }
            }

            // ---------- 游戏结束 ----------
            function gameOver(title, sub, emoji) {
                if (STATE._gameOverTriggered) return;
                STATE._gameOverTriggered = true;
                STATE.gameOver = true;
                STATE.paused = true;
                if (STATE.loopInterval) {
                    cancelAnimationFrame(STATE.loopInterval);
                }
                const minutes = Math.floor((STATE.time - 22 * 60));
                resultEmoji.textContent = emoji || '😭';
                resultTitle.textContent = title || '被抓到了！';
                resultSub.textContent = sub || '手机被没收了...';
                resultDetail.textContent = `坚持了 ${minutes} 分钟 · 快乐值 ${Math.round(STATE.happiness)}% · 警觉值 ${Math.round(STATE.alertness)}%`;
                gameOverlay.classList.add('active');
                playSound('gameover');
                ringOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');
                lockActionOverlay.classList.remove('active');
                updateUI();
            }

            function winGame() {
                if (STATE._gameOverTriggered) return;
                STATE.gameWon = true;
                STATE.paused = true;
                if (STATE.loopInterval) {
                    cancelAnimationFrame(STATE.loopInterval);
                }
                resultEmoji.textContent = '🎉';
                resultTitle.textContent = '胜利！';
                resultSub.textContent = `你成功玩到了12点！快乐值 ${Math.round(STATE.happiness)}%`;
                resultDetail.textContent = `👏 太棒了！警觉值 ${Math.round(STATE.alertness)}%`;
                gameOverlay.classList.add('active');
                playSound('win');
                ringOverlay.classList.remove('active');
                phoneCell.classList.remove('ringing');
                lockActionOverlay.classList.remove('active');
                updateUI();
            }

            // ---------- 键盘 ----------
            function handleKeydown(e) {
                const key = e.key;

                if (key === 'x' || key === 'X') {
                    if (STATE.ringActive) {
                        e.preventDefault();
                        muteRing();
                        return;
                    }
                }

                if (STATE.qteActive && !STATE.qteDone) {
                    const validKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
                    if (validKeys.includes(key)) {
                        e.preventDefault();
                        qteInput(key);
                    }
                    return;
                }

                if (STATE.gameOver || STATE.gameWon || STATE.paused || STATE.ringActive || STATE.lockActionGlobal) return;

                switch (key) {
                    case '1':
                        actionPlay();
                        break;
                    case '2':
                        actionHide();
                        break;
                    case '3':
                        actionLock('left');
                        break;
                    case '4':
                        actionUnlock('left');
                        break;
                    case '5':
                        if (STATE.difficulty === 'hard') actionLock('right');
                        break;
                    case '6':
                        if (STATE.difficulty === 'hard') actionUnlock('right');
                        break;
                }
            }

            // ---------- 音效 ----------
            let audioCtx = null;

            function getAudioCtx() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (_) { return null; }
                }
                return audioCtx;
            }

            function playSound(type) {
                try {
                    const ctx = getAudioCtx();
                    if (!ctx) return;
                    if (ctx.state === 'suspended') {
                        ctx.resume();
                    }
                    const now = ctx.currentTime;
                    // 简单音效，使用振荡器
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    let freq = 440,
                        duration = 0.1,
                        vol = 0.05,
                        typeOsc = 'sine';
                    switch (type) {
                        case 'footstep':
                            freq = 120;
                            duration = 0.2;
                            vol = 0.08;
                            typeOsc = 'sine';
                            break;
                        case 'knock':
                            freq = 300;
                            duration = 0.08;
                            vol = 0.08;
                            typeOsc = 'square';
                            break;
                        case 'enter':
                            freq = 400;
                            duration = 0.25;
                            vol = 0.08;
                            typeOsc = 'sawtooth';
                            break;
                        case 'caught':
                            freq = 600;
                            duration = 0.4;
                            vol = 0.1;
                            typeOsc = 'square';
                            break;
                        case 'safe':
                            freq = 523;
                            duration = 0.3;
                            vol = 0.06;
                            typeOsc = 'sine';
                            break;
                        case 'lock':
                            freq = 600;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'square';
                            break;
                        case 'lock_start':
                            freq = 300;
                            duration = 0.2;
                            vol = 0.04;
                            typeOsc = 'sine';
                            break;
                        case 'unlock':
                            freq = 200;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'square';
                            break;
                        case 'ring':
                            freq = 880;
                            duration = 0.35;
                            vol = 0.06;
                            typeOsc = 'square';
                            break;
                        case 'mute':
                            freq = 600;
                            duration = 0.12;
                            vol = 0.04;
                            typeOsc = 'sine';
                            break;
                        case 'qte_start':
                            freq = 440;
                            duration = 0.2;
                            vol = 0.06;
                            typeOsc = 'sine';
                            break;
                        case 'qte_correct':
                            freq = 880;
                            duration = 0.06;
                            vol = 0.05;
                            typeOsc = 'sine';
                            break;
                        case 'qte_fail':
                            freq = 200;
                            duration = 0.25;
                            vol = 0.06;
                            typeOsc = 'sawtooth';
                            break;
                        case 'qte_success':
                            freq = 659;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'sine';
                            break;
                        case 'gameover':
                            freq = 400;
                            duration = 0.3;
                            vol = 0.08;
                            typeOsc = 'sawtooth';
                            break;
                        case 'win':
                            freq = 523;
                            duration = 0.1;
                            vol = 0.05;
                            typeOsc = 'sine';
                            break;
                        default:
                            return;
                    }
                    osc.type = typeOsc;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (_) {}
            }

            // ---------- 事件绑定 ----------
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const diff = btn.dataset.diff;
                    startGame(diff);
                });
            });

            btnPlay.addEventListener('click', actionPlay);
            btnHide.addEventListener('click', actionHide);
            btnLockLeft.addEventListener('click', () => actionLock('left'));
            btnUnlockLeft.addEventListener('click', () => actionUnlock('left'));
            btnLockRight.addEventListener('click', () => actionLock('right'));
            btnUnlockRight.addEventListener('click', () => actionUnlock('right'));

            doorLeft.addEventListener('click', () => {
                if (STATE.doors.left.locked && STATE.doors.left.lockTimer > 0) {
                    actionUnlock('left');
                } else {
                    actionLock('left');
                }
            });
            doorRight.addEventListener('click', () => {
                if (STATE.doors.right.locked && STATE.doors.right.lockTimer > 0) {
                    actionUnlock('right');
                } else {
                    actionLock('right');
                }
            });

            phoneCell.addEventListener('click', () => {
                if (STATE.phone === 'playing') {
                    actionHide();
                } else {
                    actionPlay();
                }
            });

            restartBtn.addEventListener('click', () => {
                menuOverlay.classList.remove('hidden');
                gameOverlay.classList.remove('active');
                if (STATE.loopInterval) {
                    cancelAnimationFrame(STATE.loopInterval);
                }
                document.getElementById('game').classList.remove('hard-mode');
                roomGrid.style.gridTemplateColumns = '1fr 1fr 1fr';
            });

            document.addEventListener('keydown', handleKeydown);
            document.addEventListener('dblclick', (e) => e.preventDefault());

            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#game')) {
                    e.preventDefault();
                }
            }, { passive: false });

            // 启动菜单
            menuOverlay.classList.remove('hidden');
            console.log('📱 保护手机 - 快乐值系统');
            console.log('🎯 目标：玩手机到12点，快乐值达到80%');
            console.log('🎮 快捷键: 1玩 2藏 · 3锁左门 4开左门 · 5锁右门 6开右门 · X静音');
            console.log('⬆️⬇️⬅️➡️ QTE');
        })();
    </script>

</body>
