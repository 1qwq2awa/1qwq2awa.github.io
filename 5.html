<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 保护手机 - 快乐值系统</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
            background-image: radial-gradient(ellipse at 30% 20%, #1a1f35 0%, #0b0e1a 70%);
        }

        #game {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(145deg, #141a2b, #1a2138);
            border-radius: 40px 40px 32px 32px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            transition: opacity 0.2s;
        }

        /* ===== 难度选择覆盖层 ===== */
        #menu-overlay {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            z-index: 40;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        #menu-overlay.hidden {
            display: none;
        }

        #menu-overlay .logo {
            font-size: 64px;
            margin-bottom: 8px;
        }
        #menu-overlay .title {
            font-size: 28px;
            font-weight: 800;
            color: #f7e9a0;
            margin-bottom: 6px;
        }
        #menu-overlay .sub {
            font-size: 16px;
            color: #9aacd8;
            margin-bottom: 24px;
        }
        .difficulty-btn {
            padding: 14px 32px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            color: #b8c7e6;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            width: 200px;
            margin: 6px 0;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .difficulty-btn:active {
            transform: scale(0.95);
        }
        .difficulty-btn.easy {
            border-color: #7bff9e;
            color: #7bff9e;
        }
        .difficulty-btn.easy:hover {
            background: rgba(123, 255, 158, 0.1);
        }
        .difficulty-btn.normal {
            border-color: #8fcbff;
            color: #8fcbff;
        }
        .difficulty-btn.normal:hover {
            background: rgba(100, 180, 255, 0.1);
        }
        .difficulty-btn.hard {
            border-color: #ff7b89;
            color: #ff7b89;
        }
        .difficulty-btn.hard:hover {
            background: rgba(255, 80, 80, 0.1);
        }
        .difficulty-btn .desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.6;
            display: block;
        }

        /* ===== 顶部状态栏 ===== */
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 14px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 6px 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 600;
            color: #b8c7e6;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px 4px 10px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.3px;
        }

        .status-item .emoji {
            font-size: 18px;
            line-height: 1;
        }

        #time-display {
            color: #f7e9a0;
            font-size: 18px;
            font-weight: 700;
            min-width: 56px;
            text-align: center;
        }

        #lives-display {
            color: #ff7b89;
            font-size: 17px;
        }

        /* ===== 快乐值进度条 ===== */
        #happiness-wrap {
            width: 100%;
            margin: 8px 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
        }

        #happiness-label {
            font-size: 13px;
            font-weight: 600;
            color: #9aacd8;
            white-space: nowrap;
            min-width: 36px;
        }

        #happiness-track {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #happiness-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #f7e9a0, #ffb07c, #ff7b89);
            transition: width 0.3s ease;
        }

        #happiness-text {
            font-size: 13px;
            font-weight: 600;
            color: #9aacd8;
            min-width: 36px;
            text-align: right;
        }

        /* ===== 警觉值进度条 ===== */
        #alertness-wrap {
            width: 100%;
            margin: 4px 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
        }

        #alertness-label {
            font-size: 13px;
            font-weight: 600;
            color: #9aacd8;
            white-space: nowrap;
            min-width: 36px;
        }

        #alertness-track {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #alertness-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #7bff9e, #f7e9a0, #ff7b89);
            transition: width 0.3s ease, background 0.3s ease;
        }

        #alertness-text {
            font-size: 13px;
            font-weight: 600;
            color: #9aacd8;
            min-width: 36px;
            text-align: right;
        }

        /* ===== 场景区域 ===== */
        #scene {
            position: relative;
            padding: 18px 12px 14px;
            margin: 14px 0 12px;
            background: radial-gradient(ellipse at 50% 80%, #1e2742, #11172b);
            border-radius: 28px;
            min-height: 170px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 8px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        #scene.danger {
            border-color: rgba(255, 80, 80, 0.3);
            box-shadow: inset 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 50, 50, 0.08);
        }

        /* 房间布局 */
        .room-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 6px 10px;
            width: 100%;
            max-width: 360px;
            justify-items: center;
            align-items: center;
        }

        .room-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            padding: 6px 4px;
            border-radius: 16px;
            transition: all 0.25s;
            position: relative;
            min-width: 50px;
            min-height: 56px;
        }

        .room-item .sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .room-item .sub.active {
            color: #f7e9a0;
            background: rgba(247, 233, 160, 0.12);
        }

        .room-item .sub.danger {
            color: #ff7b89;
            background: rgba(255, 80, 80, 0.15);
            animation: pulse-text 0.6s ease-in-out infinite alternate;
        }

        .room-item .sub.success {
            color: #7bff9e;
            background: rgba(123, 255, 158, 0.12);
        }

        /* 床 */
        #bed-cell {
            grid-column: 1;
            grid-row: 1 / 3;
            font-size: 38px;
        }

        /* 手机 */
        #phone-cell {
            grid-column: 2;
            grid-row: 1;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        #phone-cell:active {
            transform: scale(0.92);
        }
        #phone-cell.playing {
            animation: glow-phone 1.2s ease-in-out infinite alternate;
        }
        #phone-cell.hidden {
            opacity: 0.3;
            filter: grayscale(0.8);
        }
        #phone-cell.ringing {
            animation: ring-phone 0.3s ease-in-out infinite alternate;
        }

        /* 玩家 */
        #player-cell {
            grid-column: 2;
            grid-row: 2;
            font-size: 38px;
        }
        #player-cell.hidden-away {
            opacity: 0.25;
            filter: grayscale(0.6);
        }

        /* 门 - 左门 (父母) */
        #door-left {
            grid-column: 3;
            grid-row: 1 / 3;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #door-left:active {
            transform: scale(0.92);
        }
        #door-left.shaking {
            animation: shake-door 0.3s ease-in-out infinite alternate;
        }
        #door-left .sub {
            cursor: pointer;
        }
        .door-lock-progress {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 2px;
            overflow: hidden;
        }
        .door-lock-progress .bar {
            height: 100%;
            width: 0%;
            background: #f7e9a0;
            border-radius: 4px;
            transition: width 0.1s;
        }

        /* 右门 (爷奶) - 困难模式专用 */
        #door-right {
            grid-column: 4;
            grid-row: 1 / 3;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }
        #door-right:active {
            transform: scale(0.92);
        }
        #door-right.shaking {
            animation: shake-door 0.3s ease-in-out infinite alternate;
        }
        #door-right .sub {
            cursor: pointer;
        }
        .hard-mode #door-right {
            display: flex;
        }
        .hard-mode .room-grid {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .room-grid {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .hard-mode .room-grid {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        #parents-cell {
            grid-column: 3;
            grid-row: 3;
            font-size: 34px;
            transition: all 0.5s;
            min-height: 50px;
        }
        .hard-mode #parents-cell {
            grid-column: 3 / 5;
        }

        #window-cell {
            grid-column: 1;
            grid-row: 3;
            font-size: 28px;
            opacity: 0.4;
        }

        /* ===== 提示信息 ===== */
        #message-area {
            margin-top: 10px;
            padding: 8px 14px;
            min-height: 44px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 40px;
            text-align: center;
            font-size: 15px;
            color: #9aacd8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.03);
            width: 100%;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: all 0.25s;
        }

        #message-area .highlight {
            color: #f7e9a0;
            font-weight: 600;
        }

        #message-area .danger-text {
            color: #ff7b89;
            font-weight: 600;
            animation: pulse-text 0.5s ease-in-out infinite alternate;
        }

        #message-area .success-text {
            color: #7bff9e;
            font-weight: 600;
        }

        /* ===== 操作按钮 ===== */
        #actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0 10px;
        }

        .action-btn {
            padding: 12px 4px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            color: #b8c7e6;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            font-family: inherit;
            line-height: 1.3;
            min-height: 56px;
            justify-content: center;
        }

        .action-btn .emoji {
            font-size: 22px;
            line-height: 1;
        }
        .action-btn .label {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
        }

        .action-btn:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn:disabled {
            opacity: 0.3;
            transform: none;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .action-btn.primary {
            background: rgba(100, 180, 255, 0.12);
            border-color: rgba(100, 180, 255, 0.15);
            color: #8fcbff;
        }
        .action-btn.primary:active {
            background: rgba(100, 180, 255, 0.2);
        }

        .action-btn.danger {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 80, 80, 0.15);
            color: #ff7b89;
        }
        .action-btn.danger:active {
            background: rgba(255, 80, 80, 0.2);
        }

        .action-btn.success {
            background: rgba(123, 255, 158, 0.08);
            border-color: rgba(123, 255, 158, 0.12);
            color: #7bff9e;
        }
        .action-btn.success:active {
            background: rgba(123, 255, 158, 0.15);
        }

        .action-btn.warning {
            background: rgba(255, 200, 100, 0.08);
            border-color: rgba(255, 200, 100, 0.12);
            color: #f7e9a0;
        }
        .action-btn.warning:active {
            background: rgba(255, 200, 100, 0.15);
        }

        /* ===== QTE 覆盖层 ===== */
        #qte-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 28px;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #qte-overlay.active {
            display: flex;
        }

        #qte-title {
            color: #f7e9a0;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        #qte-subtitle {
            color: #9aacd8;
            font-size: 13px;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        #qte-sequence {
            display: flex;
            gap: 16px;
            margin: 8px 0 16px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .qte-arrow {
            font-size: 44px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: all 0.15s;
            color: #6a7ca0;
            font-weight: 300;
        }

        .qte-arrow.active {
            border-color: #f7e9a0;
            color: #f7e9a0;
            background: rgba(247, 233, 160, 0.1);
            box-shadow: 0 0 20px rgba(247, 233, 160, 0.08);
            transform: scale(1.05);
        }

        .qte-arrow.done {
            border-color: #7bff9e;
            color: #7bff9e;
            background: rgba(123, 255, 158, 0.08);
        }

        .qte-arrow.wrong {
            border-color: #ff7b89;
            color: #ff7b89;
            background: rgba(255, 80, 80, 0.15);
            animation: shake-wrong 0.3s;
        }

        #qte-timer {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin: 4px 0 12px;
        }

        #qte-timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff7b89, #f7e9a0);
            border-radius: 10px;
            transition: width 0.05s linear;
        }

        #qte-result {
            font-size: 15px;
            font-weight: 600;
            min-height: 28px;
            color: #9aacd8;
        }

        /* ===== 手机响铃覆盖层 ===== */
        #ring-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(200, 50, 50, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            z-index: 15;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: ring-pulse 0.5s ease-in-out infinite alternate;
        }

        #ring-overlay.active {
            display: flex;
        }

        #ring-overlay .ring-icon {
            font-size: 64px;
            margin-bottom: 8px;
            animation: ring-phone 0.3s ease-in-out infinite alternate;
        }

        #ring-overlay .ring-text {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        #ring-overlay .ring-sub {
            color: #ffb07c;
            font-size: 16px;
            margin-top: 6px;
            font-weight: 600;
        }

        #ring-timer {
            width: 160px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }

        #ring-timer-bar {
            height: 100%;
            width: 100%;
            background: #ff7b89;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* ===== 锁门动作覆盖层 ===== */
        #lock-action-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            border-radius: 28px;
            z-index: 18;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lock-action-overlay.active {
            display: flex;
        }

        #lock-action-overlay .lock-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        #lock-action-overlay .lock-text {
            color: #f7e9a0;
            font-size: 18px;
            font-weight: 700;
        }
        #lock-action-overlay .lock-sub {
            color: #9aacd8;
            font-size: 14px;
            margin-top: 4px;
        }
        #lock-action-progress {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }
        #lock-action-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f7e9a0, #ffb07c);
            border-radius: 10px;
            transition: width 0.1s;
        }

        /* ===== 游戏结束 / 胜利 覆盖层 ===== */
        #game-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            z-index: 30;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 24px;
            text-align: center;
        }

        #game-overlay.active {
            display: flex;
        }

        #game-overlay .big-emoji {
            font-size: 72px;
            margin-bottom: 12px;
        }

        #game-overlay .title {
            font-size: 28px;
            font-weight: 800;
            color: #f7e9a0;
            margin-bottom: 6px;
        }

        #game-overlay .subtitle {
            font-size: 16px;
            color: #9aacd8;
            margin-bottom: 6px;
            max-width: 280px;
        }

        #game-overlay .detail {
            font-size: 14px;
            color: #6a7ca0;
            margin-bottom: 20px;
        }

        #game-overlay .restart-btn {
            padding: 14px 44px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #f7e9a0, #e8c87a);
            color: #1a2138;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(247, 233, 160, 0.2);
        }

        #game-overlay .restart-btn:active {
            transform: scale(0.95);
        }

        #game-overlay .restart-btn:hover {
            box-shadow: 0 6px 30px rgba(247, 233, 160, 0.3);
        }

        /* ===== 动画 ===== */
        @keyframes glow-phone {
            0% {
                filter: drop-shadow(0 0 8px rgba(100, 180, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 24px rgba(100, 180, 255, 0.6));
                transform: scale(1.04);
            }
        }

        @keyframes ring-phone {
            0% {
                transform: rotate(-8deg) scale(1);
                filter: drop-shadow(0 0 10px rgba(255, 80, 80, 0.8));
            }
            100% {

<body>

    <div id="game">

        <!-- ===== 难度选择菜单 ===== -->

                <div id="door-left" class="room-item" title="点击锁门/开门 (左门)">

                    <span class="sub" id="door-right-label">🔓 未锁</span>

            <!-- ===== 锁门动作覆盖层 ===== -->

                <div class="lock-sub">请等待 <span id="lock-action-remain">5</span> 秒</div>
